<script>
const KEY='nadaum.profile.v1';
const BASE='https://nadaumlap.github.io/nadaumneed';
const SHORT={v:'v',id:'i',created:'c',updated:'u',modules:'m',designs:'g'};

/* ───────── 저장 ───────── */
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(p){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
function blank(){return{v:1,id:'ND-'+r4()+'-'+r4(),created:today(),updated:today(),modules:{},designs:[],checks:{},history:[]}}
function r4(){return Math.random().toString(36).slice(2,6).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

/* ───────── 보관 링크 인코딩 ─────────
   형식 v1: base64url(JSON) — 키를 1글자로 줄여 길이를 압축한다.
   이 형식은 이미 발급된 링크를 깨뜨리지 않기 위해 변경하지 않는다. */
/* 모듈·필드 이름을 1~2글자로 줄여 링크 길이를 압축한다.
   이미 발급된 링크가 깨지지 않도록 이 표는 항목 추가만 하고 기존 항목은 바꾸지 않는다. */
const MK={tendency:'t',needscan:'n',noise:'x',temperament:'p',motivation:'m',noiseInner:'i',alignment:'a',authorship:'d'};
const MKr=Object.fromEntries(Object.entries(MK).map(([a,b])=>[b,a]));
const FK={ts:'s',main:'a',sub:'b',avgs:'v',overall:'o',flag:'f',
  nci:'c',d1:'1',d2:'2',d3:'3',d4:'4',influence:'n',aware:'w',weak:'k',weakVal:'y',seg:'g',
  total:'t',nunchi:'u',compare:'r',exposure:'e',top:'p',tied:'d',totalSeg:'q',snsMin:'z',branch:'h',
  axisScores:'j',ns:'N',ha:'H',rd:'R',ps:'P',sdtScore:'S',raw:'W',pct:'C',z:'Z',
  score:'l',a1:'5',a2:'6',a3:'7',a4:'8',values:'V',statement:'M',criteria:'T'};
const FKr=Object.fromEntries(Object.entries(FK).map(([a,b])=>[b,a]));
const AVGO=['A','C','S','D','E'];
function pack(p){
  const o={v:1,i:p.id.replace(/^ND-/,'').replace(/-/g,''),c:d8(p.created),u:d8(p.updated),m:{},
    g:(p.designs||[]).map(x=>[d8(x.ts),x.axis,x.text,x.id])};
  const ck={};for(const k in (p.checks||{}))ck[d8(k)]=p.checks[k];
  if(Object.keys(ck).length)o.k=ck;
  if(p.values&&p.values.length)o.V=p.values;
  for(const k in p.modules){
    const src=p.modules[k],dst={};
    for(const f in src){
      let val=src[f]; if(val===null||val===undefined)continue;
      if(f==='ts')val=d8(val);
      if(f==='avgs'&&typeof val==='object')val=AVGO.map(c=>val[c]);
      if(f==='z')continue;                       // 순위 산출용 파생값 — 링크에서 제외
      dst[FK[f]||f]=val;
    }
    o.m[MK[k]||k]=dst;
  }
  return b64e(JSON.stringify(o));
}
function unpack(str){
  try{
    const o=JSON.parse(b64d(str)); const mods={};
    for(const k in (o.m||{})){
      const src=o.m[k],dst={};
      for(const f in src){
        const name=FKr[f]||f; let val=src[f];
        if(name==='ts')val=d10(val);
        if(name==='avgs'&&Array.isArray(val)){const t={};AVGO.forEach((c,i)=>t[c]=val[i]);val=t}
        dst[name]=val;
      }
      mods[MKr[k]||k]=dst;
    }
    const r={v:1,id:'ND-'+String(o.i).slice(0,4)+'-'+String(o.i).slice(4),
      created:d10(o.c),updated:d10(o.u),modules:mods,
      designs:(o.g||[]).map((a,i)=>({ts:d10(a[0]),axis:a[1],text:a[2],id:typeof a[3]==='number'?a[3]:i+1})),
      checks:(function(){const c={};for(const k in (o.k||{}))c[d10(k)]=o.k[k];return c})(),history:[]};
    if(o.V)r.values=o.V;
    return r;
  }catch(e){return null}
}
function d8(s){return String(s||'').replace(/-/g,'')}
function d10(s){s=String(s||'');return s.length===8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6):s}
function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));
  return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s);
  const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b)}

/* 복원 링크 병합 — 더 최근에 갱신된 모듈을 남긴다 */
function mergeFromUrl(){
  const q=new URLSearchParams(location.search).get('d');
  if(!q)return false;
  const inc=unpack(q); if(!inc)return false;
  const cur=load();
  if(!cur){save(inc);return true}
  const out=cur;
  for(const k in inc.modules){
    const a=cur.modules[k],b=inc.modules[k];
    if(!a||(b.ts||'')>=(a.ts||'')) out.modules[k]=b;
  }
  out.checks=out.checks||{};
  for(const k in (inc.checks||{})){
    const a=new Set(out.checks[k]||[]);(inc.checks[k]||[]).forEach(x=>a.add(x));
    out.checks[k]=[...a];
  }
  const seen=new Set((out.designs||[]).map(d=>d.ts+'|'+d.text));
  (inc.designs||[]).forEach(d=>{if(!seen.has(d.ts+'|'+d.text))(out.designs=out.designs||[]).push(d)});
  out.updated=today(); save(out); return true;
}

/* ───────── 진단 정의 ───────── */

/* ───────── 4축 산출 ───────── */
function axes(p){
  const m=p.modules, A={};
  // N — 욕구 선명도
  const nParts=[];
  if(m.needscan) nParts.push(m.needscan.nci);
  if(m.tendency&&typeof m.tendency.overall==='number') nParts.push(Math.round((m.tendency.overall-1)/4*100));
  if(m.motivation&&typeof m.motivation.sdtScore==='number') nParts.push(m.motivation.sdtScore);
  A.N={v:nParts.length?Math.round(nParts.reduce((a,b)=>a+b,0)/nParts.length):null,
       name:'욕구 선명도', desc:'내가 무엇으로 움직이는지 얼마나 선명한가', c:'#2979C8',
       need:'욕구 출발점 · 5러 경향성', url:BASE+'/needscan/'};
  // E1 — 신호 보존도
  let e1=null;
  if(m.noise) e1=Math.max(0,100-m.noise.total);
  else if(m.noiseInner&&typeof m.noiseInner.pct==='number') e1=Math.max(0,100-m.noiseInner.pct);
  A.E1={v:e1,name:'신호 보존도',desc:'내 신호가 얼마나 덜 흐려져 있는가',c:'#3DAA6B',
        need:'잡음 오염도',url:BASE+'/newnoise/'};
  // E2 — 정렬도 (미개발)
  A.E2={v:null,name:'생명성 정렬도',desc:'에너지가 환경과 얼마나 맞물려 있는가',c:'#C9983A',
        need:'생명성 정렬 진단 (준비 중)',url:null};
  // D — 저자성 (미개발)
  A.D={v:null,name:'자기 저자성',desc:'내 기준으로 오늘을 쓰고 있는가',c:'#8B5CF6',
       need:'나다움 설계 현황 (준비 중)',url:BASE+'/need/'};
  return A;
}
function bottleneck(A){
  const done=Object.entries(A).filter(([,a])=>a.v!==null);
  if(!done.length)return null;
  done.sort((a,b)=>a[1].v-b[1].v);
  return{key:done[0][0],...done[0][1]};
}

function crossRules(p){
  const m=p.modules,out=[];
  const top=m.noise?m.noise.top:null;
  if(m.tendency&&top&&FLOWxNOISE[m.tendency.main]&&FLOWxNOISE[m.tendency.main][top]){
    out.push({pri:10,src:'5러 경향성 × 잡음 지도',
      txt:'주된 흐름이 '+CHARS[m.tendency.main]+'인데 가장 강한 잡음이 '+NOISEAX[top]+'입니다. '+FLOWxNOISE[m.tendency.main][top]});
  }
  if(m.temperament&&top){
    const t=m.temperament,ord=[['ns',t.ns],['ha',t.ha],['rd',t.rd],['ps',t.ps]].sort((a,b)=>b[1]-a[1]);
    const k=ord[0][0];
    if(TEMPxNOISE[k]&&TEMPxNOISE[k][top])
      out.push({pri:9,src:'기질 토대 × 잡음 지도',
        txt:'가장 두드러진 기질이 '+TEMPN[k]+'입니다. '+TEMPxNOISE[k][top]});
  }
  if(m.motivation&&m.noise){
    const a=m.motivation.sdtScore>=55?1:0, n=m.noise.total>=50?1:0;
    const r=AUTOxNOISE.find(x=>x.a===a&&x.n===n);
    if(r)out.push({pri:8,src:'동기 출처 × 잡음 총량',txt:r.t});
  }
  if(m.needscan&&m.noise){
    const w=m.needscan.weak;
    if(w==='D4') out.push({pri:7,src:'욕구 출발점 × 잡음 지도',
      txt:'욕구 진단에서도 가장 낮은 축이 사회적 영향과의 거리였고, 잡음 진단에서도 '+NOISEAX[top]+'이 가장 높게 나왔습니다. 두 진단이 같은 곳을 가리키고 있습니다. 여기가 지금 가장 확실한 출발점입니다.'});
    else out.push({pri:6,src:'욕구 출발점 × 잡음 지도',
      txt:'잡음은 '+NOISEAX[top]+'에서 가장 강하게 들어오는데, 정작 가장 낮은 축은 '+DIMN[w]+'입니다. 밖에서 오는 것과 안에서 흐린 것이 서로 다른 자리에 있습니다. 둘을 같은 문제로 묶지 않는 편이 낫습니다.'});
  }
  if(m.needscan&&m.tendency){
    out.push({pri:5,src:'5러 경향성 × 욕구 출발점',
      txt:'지금 에너지는 '+FLOWKEY[m.tendency.main]+' 중심으로 흐르고 있는데, 욕구 진단의 병목은 '+DIMN[m.needscan.weak]+'입니다. '+
      (m.needscan.weak==='D2'?'무엇에서 힘을 얻는지는 알지만, 그 일을 하고 난 뒤 실제로 채워졌는지를 읽는 감각이 아직 흐립니다.'
       :m.needscan.weak==='D3'?'머리로는 방향이 분명한데, 몸이 보내는 신호는 아직 잘 들리지 않습니다.'
       :m.needscan.weak==='D1'?'에너지의 방향은 있는데, 그 방향을 누가 정했는지가 아직 흐립니다.'
       :'에너지의 방향은 뚜렷한데, 그 방향이 바깥에서 밀려온 것인지 확인할 자리가 필요합니다.')});
  }
  if(m.needscan&&m.needscan.aware>=4){
    out.push({pri:4,src:'자각 지표',
      txt:'"내가 원한다고 느끼는 것 중 많은 부분이 사실은 사회나 미디어가 주입한 것일 수 있다" — 이 문항에 강하게 동의하셨습니다. 알아차림은 잡음을 걷어내는 첫 단계이고, 이미 그 단계에 들어와 계십니다.'});
  }
  return out.sort((a,b)=>b.pri-a.pri).slice(0,4);
}

let P=null, sel={opt:null}, SN=0;
function sn(){SN++;return '<div class="sec-num">'+String(SN).padStart(2,'0')+'</div>'}
function render(){
  P=load()||blank();
  P.designs=P.designs||[];
  P.checks=P.checks||{};
  // 예전 형식(문장 id 없음) 보정
  P.designs.forEach((d,i)=>{if(typeof d.id!=='number')d.id=i+1});
  const done=DIAGS.filter(d=>P.modules[d.k]);
  const app=document.getElementById('app');
  if(!done.length){app.innerHTML=emptyView();return}
  const A=axes(P), bn=bottleneck(A), cr=crossRules(P);
  SN=0;
  let h='';
  h+=coverView(done);
  h+=summaryView(A,bn,done);
  if(cr.length>=1) h+=crossView(cr,done.length);
  h+=designView(bn);
  h+=sentencesView();
  h+=dailyView();
  h+=loopView();
  h+=keepView();
  app.innerHTML=h;
  bindDesign(bn);
}

function radar(A){
  const S=260,cx=S/2,cy=S/2,R=88;
  const ks=['N','E1','E2','D'];
  const ang=ks.map((_,i)=>(Math.PI*2*i/4)-Math.PI/2);
  let g='';
  [.25,.5,.75,1].forEach(l=>{
    const pts=ang.map(a=>(cx+R*l*Math.cos(a)).toFixed(1)+','+(cy+R*l*Math.sin(a)).toFixed(1)).join(' ');
    g+='<polygon points="'+pts+'" fill="none" stroke="#E8E8F0" stroke-width="1"/>';
  });
  ang.forEach(a=>{g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#E8E8F0"/>'});
  const pts=ks.map((k,i)=>{const v=A[k].v===null?0:A[k].v/100;
    return (cx+R*v*Math.cos(ang[i])).toFixed(1)+','+(cy+R*v*Math.sin(ang[i])).toFixed(1)}).join(' ');
  g+='<polygon points="'+pts+'" fill="rgba(41,121,200,.14)" stroke="#2979C8" stroke-width="2" stroke-dasharray="'+
     (ks.some(k=>A[k].v===null)?'5 4':'0')+'"/>';
  ks.forEach((k,i)=>{const a=A[k],v=a.v===null?0:a.v/100;
    g+='<circle cx="'+(cx+R*v*Math.cos(ang[i])).toFixed(1)+'" cy="'+(cy+R*v*Math.sin(ang[i])).toFixed(1)+'" r="4" fill="'+(a.v===null?'#C4CBDA':a.c)+'"/>';
    const lx=cx+(R+26)*Math.cos(ang[i]), ly=cy+(R+26)*Math.sin(ang[i]);
    g+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="12" font-weight="800" fill="'+(a.v===null?'#C4CBDA':a.c)+'">'+k+'</text>';
  });
  return '<div class="radar-box"><svg viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg></div>';
}

  let h='<div class="sec">'+sn()+'<h2>한 장 요약</h2>'
   +'<p class="sub">N.E.E.D 네 단계를 축으로 지금 상태를 봅니다. 네 축 모두 높을수록 선명한 상태입니다.</p>';
  h+='<div class="axes-wrap">'+radar(A);

function dkey(d){return d.toISOString().slice(0,10)}
function checksOf(day){return (P.checks&&P.checks[day])||[]}
function toggleCheck(id){
  const day=today();
  P.checks=P.checks||{};
  const arr=(P.checks[day]||[]).slice();
  const at=arr.indexOf(id);
  if(at>=0)arr.splice(at,1);else arr.push(id);
  if(arr.length)P.checks[day]=arr;else delete P.checks[day];
  P.updated=day;save(P);render();
}
function weekDays(){
  const out=[],now=new Date();
  const dow=(now.getDay()+6)%7;               // 월=0
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);out.push(d)}
  return out;
}
function streakStats(){
  const total=P.designs.length||1;
  let kept=0,days=0,run=0,best=0,cur=0;
  const keys=Object.keys(P.checks||{}).sort();
  const first=keys.length?new Date(keys[0]):new Date();
  const span=Math.max(1,Math.round((new Date(today())-first)/86400000)+1);
  for(let i=0;i<span;i++){
    const d=new Date(first);d.setDate(first.getDate()+i);
    const n=checksOf(dkey(d)).length;
    if(n>0){days++;kept+=n;run++;if(run>best)best=run}else run=0;
  }
  // 오늘 기준 연속
  cur=0;
  for(let i=0;;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    if(checksOf(dkey(d)).length>0)cur++;else break;
    if(i>400)break;
  }
  return{span,days,kept,best,cur,total};
}
function dailyView(){
  if(!P.designs.length)return '';
  const day=today(),on=checksOf(day);
  const wd=['월','화','수','목','금','토','일'];
  const now=new Date();
  const dnames=['일','월','화','수','목','금','토'];
  let h='<div class="sec">'+sn()+'<h2>오늘의 실천</h2>'
   +'<p class="sub">남기신 문장을 오늘 지키셨다면 눌러 주세요. 다 지키지 못한 날이 있어도 괜찮습니다. 기록이 쌓이는 것 자체가 변화를 보여 줍니다.</p>';
  h+='<div class="today-box"><div class="today-date">'+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+dnames[now.getDay()]+'요일</div>';
  P.designs.forEach((d,i)=>{
    h+='<button class="chk'+(on.includes(d.id)?' on':'')+'" onclick="toggleCheck('+d.id+')">'
      +'<span class="box"></span><span class="ct">'+esc(d.text)+'</span></button>';
  });
  h+='</div>';
  // 주간 그리드
  const days=weekDays(),tot=P.designs.length;
  h+='<div class="week"><h4>이번 주</h4><div class="wk-grid">';
  days.forEach((d,i)=>{
    const k=dkey(d),n=checksOf(k).length,isFuture=k>day;
    const cls=n===0?'':(n>=tot?'full':'part');
    h+='<div class="wk-cell"><div class="wk-dot '+cls+(k===day?' today':'')+'">'
      +(isFuture?'':(n>0?n:''))+'</div><div class="wk-lab">'+wd[i]+'</div></div>';
  });
  h+='</div>';
  const st=streakStats();
  h+='<div class="streak">'
   +'<div><div class="sv">'+st.days+'일</div><div class="sl">지금까지 실천한 날</div></div>'
   +'<div><div class="sv">'+st.cur+'일</div><div class="sl">연속 실천 중</div></div>'
   +'<div><div class="sv">'+st.best+'일</div><div class="sl">최고 연속</div></div></div>';
  h+='</div></div>';
  return h;
}

function icsFold(line){
  // RFC 5545 — 한 줄 75옥텟 제한. UTF-8 이므로 바이트 기준으로 접고, 이어지는 줄은 공백으로 시작한다.
  const enc=new TextEncoder(), out=[]; let cur='', bytes=0;
  for(const ch of line){
    const n=enc.encode(ch).length;
    if(bytes+n>73){ out.push(cur); cur=' '; bytes=1; }
    cur+=ch; bytes+=n;
  }
  out.push(cur);
  return out.join('\r\n');
}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function makeICS(){
  const d=new Date();d.setDate(d.getDate()+28);

  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//나다움설계연구소//NEED//KO','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:need-'+P.id+'-'+ymd+'@nadaumlap.github.io',

    'DTSTART;VALUE=DATE:'+ymd,'DTEND;VALUE=DATE:'+nx.toISOString().slice(0,10).replace(/-/g,''),
    'SUMMARY:'+icsEsc('그 문장, 지켜졌나요? — 나다움 설계 점검'),
    'DESCRIPTION:'+icsEsc(desc),
    'URL:'+short,

    'DESCRIPTION:'+icsEsc('나다움 설계 점검'),'END:VALARM','END:VEVENT','END:VCALENDAR'];
  const ics=lines.map(icsFold).join('\r\n')+'\r\n';
  const b=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);

  if(merged){
    toast('보관 링크의 결과를 불러왔습니다');
    history.replaceState(null,'',location.pathname);
  }
})();
</script>
