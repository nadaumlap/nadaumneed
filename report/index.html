<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta property="og:type" content="website">
<meta property="og:url" content="https://nadaumlap.github.io/nadaumneed/report/">
<meta property="og:image" content="https://nadaumlap.github.io/nadaumneed/report/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="나다움 설계 통합 리포트">
<meta property="og:site_name" content="나다움설계연구소">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#F8F9FB !important;color:#1E2761 !important;color-scheme:light only}
body{font-family:'Pretendard','Noto Sans KR',sans-serif;line-height:1.55;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:-apple-system,'SF Pro Display','SF Pro Text','Apple SD 산돌고딕 Neo','Pretendard',sans-serif;word-break:keep-all}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 80px}
@media (min-width:900px){.wrap{max-width:1040px}}

/* 헤더 */
.logo-bar{padding:20px 0 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #E8E8F0;margin-bottom:18px}
.logo-actions{margin-left:auto;display:flex;gap:7px}
.hbtn{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:1px solid #DCE2ED;border-radius:9px;background:#FFF;color:#4A5568;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s}
.hbtn:hover{border-color:#1E2761;color:#1E2761}
.hbtn svg{width:13px;height:13px;flex:0 0 13px}
@media (max-width:519px){.hbtn .hl{display:none}.hbtn{padding:9px 11px}.hbtn svg{width:15px;height:15px;flex:0 0 15px}}
.logo-need{font-family:'Montserrat',sans-serif;font-size:20px;font-weight:800;letter-spacing:2px;display:flex;gap:2px}
.logo-need .n{color:#2979C8}.logo-need .e1{color:#3DAA6B}.logo-need .e2{color:#C9983A}.logo-need .d{color:#8B5CF6}
.logo-sep{width:1px;height:22px;background:#E8E8F0}
.logo-right{display:flex;flex-direction:column;gap:1px}
.logo-right .top{font-size:10px;font-weight:600;letter-spacing:1px;color:#6B7393}
.logo-right .bot{font-size:12px;font-weight:500;color:#1E2761}
@media (max-width:399px){.logo-right .top{display:none}.logo-bar{padding:16px 0 10px}}

/* 탭 내비게이션 */
/* 책갈피 탭 */
.tabnav{position:sticky;top:0;z-index:40;background:#F8F9FB;padding:6px 0 0;margin:0 0 -1px;box-shadow:0 6px 12px -6px rgba(30,39,97,.10)}
.tabnav-in{display:flex;align-items:stretch;gap:5px}
.tabnav a{flex:1 1 0;min-width:0;position:relative;margin-top:7px;display:block;text-decoration:none;
  background:var(--tb);border:1px solid var(--tbd);border-bottom:none;border-top:3px solid var(--tc);
  border-radius:13px 13px 0 0;padding:9px 9px 13px;transition:margin-top .16s ease,filter .16s}
.tabnav a .tno{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:800;color:var(--tc);letter-spacing:.4px;display:block}
.tabnav a .tnm{font-size:13px;font-weight:800;color:#5C6478;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tabnav a .tni{position:absolute;right:10px;bottom:12px;color:var(--tc);opacity:.55}
.tabnav a .tni svg{width:17px;height:17px;display:block}
.tabnav a:not(.on){filter:saturate(.7)}
.tabnav a.on{margin-top:0;padding-bottom:19px;z-index:2;box-shadow:0 -3px 10px rgba(30,39,97,.06)}
.tabnav a.on .tnm{color:#1A2138}
.tabnav a.on .tni{opacity:1}
@media (max-width:459px){.tabnav a .tni{display:none}.tabnav a{padding:9px 7px 13px}.tabnav a .tnm{font-size:12px}}
@media (max-width:339px){.tabnav a .tnm{font-size:11px}}
.panel{background:#FFF;border:1px solid var(--tbd);border-top:2px solid var(--tc);border-radius:0 0 18px 18px;padding:22px 18px 26px;box-shadow:0 6px 22px rgba(30,39,97,.05);margin-bottom:22px}
@media (min-width:900px){.panel{padding:30px 30px 34px;border-radius:0 0 20px 20px}}
.panel>.sec:first-child{margin-top:0}
/* 단계 이동 */
.stepnav{display:flex;gap:9px;justify-content:center;margin:26px 0 4px}
.sb{display:inline-flex;align-items:center;gap:6px;padding:12px 18px;border:1px solid #DCE2ED;border-radius:11px;background:#FFF;color:#4A5568;font-size:13.5px;font-weight:700;text-decoration:none;transition:border-color .15s,color .15s}
.sb:hover{border-color:#1E2761;color:#1E2761}
.sb.pri{background:#1E2761;border-color:#1E2761;color:#FFF}
/* 2단 배치 (데스크톱) */
@media (min-width:900px){
  .two{display:grid;grid-template-columns:0.86fr 1fr;gap:26px;align-items:start}
  .two>*{min-width:0}
  .two .sec{margin-bottom:0}
  .panel .sec{max-width:none}
}
/* 표지 질문에 대한 답 한 줄 */
.answer{background:#1E2761;border-radius:13px;padding:15px 16px;margin:2px 0 4px}
.answer .al{font-size:10.5px;letter-spacing:1.3px;font-weight:800;color:#8FA8E0;margin-bottom:6px}
.answer p{font-size:14.5px;line-height:1.7;color:#FFF;word-break:keep-all}
.answer b{color:#FFD98A;font-weight:800}
/* 강점 카드 */
.str-wrap{display:grid;gap:9px}
@media (min-width:700px){.str-wrap{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}}
.str{background:#FFF;border:1px solid #E4E8F2;border-left:4px solid var(--sc);border-radius:12px;padding:14px 15px}
.str .sh{font-size:15px;font-weight:800;color:var(--sc);line-height:1.4}
.str .sp{font-size:13px;color:#4A5568;line-height:1.75;margin-top:6px;word-break:keep-all}
/* 다음 한 칸 */
.nextcard{background:#F4F7FC;border:1px solid #DCE5F4;border-radius:14px;padding:17px 17px 18px;margin-top:14px}
.nextcard.done{font-size:13.5px;color:#4A5568;line-height:1.8;text-align:center}
.nextcard.done a{color:#2979C8;font-weight:700}
.nextcard .nl{font-size:11px;letter-spacing:1px;font-weight:800;color:#5A7BB8;margin-bottom:6px}
.nextcard .nq{font-size:16px;font-weight:800;color:#1A2138;line-height:1.45;word-break:keep-all;margin-bottom:13px}
.nextcard .nb{display:block;text-align:center;padding:14px;border-radius:11px;background:#1E2761;color:#FFF;font-size:14.5px;font-weight:800;text-decoration:none}
.nextcard .nn{font-size:12px;color:#6B7393;margin-top:9px;line-height:1.7;text-align:center}
/* 축 요약(읽기 탭) */
.axis-lite{display:flex;align-items:baseline;gap:9px;padding:11px 2px 4px}
.axis-lite.empty{opacity:.55}
.axis-lite .al-k{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:800;color:#6B7393;min-width:24px}
.axis-lite .al-n{font-size:14.5px;font-weight:800;color:#1A2138;flex:1}
.axis-lite .al-v{font-size:16px;font-weight:800;color:#6B7393}
.q-more{display:block;width:100%;margin-top:10px;padding:12px;border:1px dashed #C8D2E2;border-radius:11px;background:#FFF;color:#4A5568;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
.bwhy{display:block;margin-top:9px;font-size:12.5px;color:#5A6478;line-height:1.75}
.carenote{background:#FFF8E8;border:1px solid #EDD9A8;border-radius:12px;padding:14px 15px;margin-bottom:16px;font-size:12.5px;color:#6B5A2E;line-height:1.8;word-break:keep-all}
.carenote b{display:block;color:#8A6D1F;font-size:13px;margin-bottom:5px}
.guide{background:#F4F7FC;border:1px solid #E1E8F4;border-radius:12px;padding:14px 15px;margin-top:18px}
.guide .gt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#2979C8;margin-bottom:6px}
.guide p{font-size:12.5px;color:#5A6478;line-height:1.8;word-break:keep-all}
.tabnav a.on{color:#1E2761;border-bottom-color:#1E2761}
.tabnav a.on .tn{color:#2979C8;opacity:1}
.tab-lead{font-size:13px;color:#6B7393;line-height:1.75;margin:-4px 0 20px;word-break:keep-all}
.guard{font-size:12.5px;color:#6B7393;background:#F7F9FC;border:1px solid #E7EBF3;border-radius:10px;padding:11px 13px;margin:14px 0 4px;line-height:1.75;word-break:keep-all}
.empty-tab{background:#F7F9FC;border:1px dashed #CBD3E1;border-radius:12px;padding:22px 16px;text-align:center;font-size:13.5px;color:#5A6478;line-height:1.85;word-break:keep-all}
.empty-tab .btn{margin-top:14px;display:inline-block}
.q-grp{font-size:11px;letter-spacing:1.2px;color:#6B7393;font-weight:800;margin:18px 0 8px}
.todo.next{border-color:#1E2761;box-shadow:0 4px 14px rgba(30,39,97,.10)}
.todo.next .ar{color:#1E2761;font-weight:800}
.todo.dim{opacity:.72}
/* 처음 → 지금 → 다음 */
.fnn{display:flex;align-items:stretch;gap:8px;margin:4px 0 16px}
.fnn>div{flex:1;background:#FFF;border:1px solid #E4E8F2;border-radius:12px;padding:12px 11px;text-align:center}
.fnn .fl{font-size:10.5px;letter-spacing:.8px;font-weight:800;color:#6B7393}
.fnn .fd{font-size:11px;color:#6B7393;margin-top:3px}
.fnn .fv{font-size:19px;font-weight:800;color:#1E2761;margin-top:7px}
.fnn .fu{font-size:11.5px;color:#6B7393;margin-top:3px}
.fnn .nxt{background:#F3F6FC;border-style:dashed}
.fnn .nxt .fv{color:#6B7393}

/* 표지 */
.cover{padding:6px 0 28px}
.cover .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:#EEF2FB;font-size:12px;font-weight:700;color:#1E2761;margin-bottom:14px}
.cover h1{font-size:25px;font-weight:800;line-height:1.38;margin-bottom:12px}
.cover .lead{font-size:15px;color:#4A5568;line-height:1.7;word-break:keep-all}
.meta-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;font-size:12px;color:#6B7393}
.meta-line span{background:#FFF;border:1px solid #E8E8F0;border-radius:20px;padding:5px 12px}

/* 공통 섹션 */
.sec{margin-bottom:30px}
.sec-num{font-size:11px;letter-spacing:1.5px;color:#6B7393;font-weight:700;margin-bottom:6px}
.sec h2{font-size:19px;font-weight:800;margin-bottom:6px;line-height:1.4}
.sec .sub{font-size:13.5px;color:#6B7393;line-height:1.7;margin-bottom:16px;word-break:keep-all}
.card{background:#FFF;border:1px solid #E8E8F0;border-radius:16px;padding:20px;margin-bottom:14px}

/* 4축 */
.axes-wrap{background:#FFF;border:1px solid #E8E8F0;border-radius:16px;padding:22px 20px;margin-bottom:14px}
.radar-box{max-width:300px;margin:0 auto 18px}
.trend-box{background:#fff;border:1px solid #E4E8F2;border-radius:12px;padding:14px 8px 10px}
.trend-box svg{width:100%;height:auto;display:block}
.trend-leg{display:flex;flex-wrap:wrap;gap:9px 14px;justify-content:center;margin-top:10px}
.trend-leg span{font-size:11.5px;color:#4A5568;display:inline-flex;align-items:center;gap:5px}
.trend-leg i{width:12px;height:3px;border-radius:2px;display:inline-block}
.trend-delta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.trend-delta>div{background:#F7F9FC;border:1px solid #E4E8F2;border-radius:9px;padding:9px 11px}
.trend-delta .tdn{font-size:11.5px;color:#6B7393;letter-spacing:.2px}
.trend-delta .tdv{font-size:15.5px;font-weight:700;margin-top:3px}
.trend-note{font-size:12.5px;color:#5A6478;line-height:1.8;margin-top:12px;word-break:keep-all}
.ics-row .btn{white-space:nowrap;font-size:13.5px;padding-left:14px;padding-right:14px}
.ics-hint{font-size:11.5px;color:#6B7393;line-height:1.7;margin-top:9px;word-break:keep-all}
.trend-empty{background:#F7F9FC;border:1px dashed #CBD3E1;border-radius:11px;padding:17px 14px;font-size:13px;color:#5A6478;line-height:1.85;text-align:center;word-break:keep-all}
.tup{color:#2F855A}.tdown{color:#C05621}.tflat{color:#6B7393}
.radar-box svg{width:100%;height:auto;display:block}
.axis-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.axis-key{width:34px;flex-shrink:0;font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;text-align:center}
.axis-mid{flex:1;min-width:0}
.axis-name{font-size:12.5px;font-weight:600;color:#1E2761;margin-bottom:5px}
.axis-track{height:8px;background:#E8E8F0;border-radius:4px;overflow:hidden}
.axis-fill{height:100%;border-radius:4px;transition:width 1s ease}
.axis-val{width:52px;flex-shrink:0;text-align:right;font-size:13px;font-weight:800}
.axis-row.empty .axis-name,.axis-row.empty .axis-val{color:#6B7393}
.axis-row.empty .axis-key{color:#C4CBDA}
.pend-link{font-size:11.5px;color:#6B7393;text-decoration:none;border-bottom:1px dotted #A0AAC0}

/* 병목 */
/* 여정 지도 */
.jn{margin:2px 0 20px}
.jn-cap{font-size:11px;letter-spacing:1.5px;color:#6B7393;font-weight:700;margin-bottom:10px}
.jn-tip{display:flex;align-items:center;gap:9px;font-size:12px;color:#98A1B5;font-weight:700;margin-bottom:2px}
.jn-tip i{width:24px;flex:0 0 24px;text-align:center;font-style:normal;color:#C4CBDA;font-size:15px}
.jn-row{display:flex;gap:12px}
.jn-rail{width:24px;flex:0 0 24px;display:flex;justify-content:center;position:relative}
.jn-rail::before{content:'';position:absolute;top:0;bottom:0;width:2px;background:#E7EBF3}
.jn-row.on .jn-rail::before{background:var(--jc);opacity:.3}
.jn-dot{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:#FFF;border:2px solid #DCE2ED;color:#6B7393;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.jn-row.on .jn-dot{border-color:var(--jc);color:var(--jc)}
.jn-row.here .jn-dot{background:var(--jc);border-color:var(--jc);color:#FFF}
.jn-body{flex:1;padding:0 0 17px}
.jn-t{font-size:15px;font-weight:800;color:#1A2138;line-height:1.4;word-break:keep-all}
.jn-row:not(.on) .jn-t{color:#6B7393}
.jn-here{display:inline-block;font-size:10.5px;font-weight:800;color:#FFF;background:var(--jc);border-radius:20px;padding:2.5px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.jn-meta{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.jn-ax{font-size:12px;color:#6B7393}
.jn-v{font-size:14.5px;font-weight:800;color:var(--jc)}
.jn-row:not(.on) .jn-v{color:#8B93A6}
.jn-en{font-size:10.5px;letter-spacing:.5px;color:#6B7393;margin-top:3px;font-family:Montserrat,sans-serif;font-weight:600}
.jn-open{font-size:11.5px;color:#6B7393;margin-top:5px}
.jn-open a{color:var(--jc);font-weight:700;text-decoration:none;border-bottom:1px solid rgba(0,0,0,.14)}
.jn-prog{font-size:12.5px;color:#4A5568;background:#F7F9FC;border:1px solid #E7EBF3;border-radius:10px;padding:10px 13px;margin-top:4px;line-height:1.75;word-break:keep-all}
.jn-prog b{color:#1E2761}

/* 표지 아래 첫 행동 */
.hero-cta{background:linear-gradient(140deg,#1A2250 0%,#2B3573 100%);border-radius:17px;padding:20px 19px;margin-bottom:22px;position:relative;overflow:hidden}
.hero-cta::after{content:'';position:absolute;inset:0;background:radial-gradient(110% 80% at 92% -12%,var(--glow) 0%,rgba(0,0,0,0) 60%);pointer-events:none}
.hc-eb{font-size:10.5px;letter-spacing:1.6px;font-weight:800;color:var(--ac);margin-bottom:7px}
.hc-h{font-size:20px;font-weight:800;color:#FFF;line-height:1.35}
.hc-d{font-size:13px;color:#C3CBE4;line-height:1.7;margin-top:7px;word-break:keep-all}
.hc-d b{color:#FFF;font-weight:700}
.hc-btn{display:block;width:100%;margin-top:15px;padding:15px;border:none;border-radius:12px;background:#FFF;color:#1A2250;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.18);transition:transform .15s}
.hc-btn:active{transform:translateY(1px)}
.hc-f{font-size:12px;color:#A7B1D0;text-align:center;margin-top:10px}

.bottleneck{border-radius:16px;padding:20px;margin-bottom:14px;background:var(--bnbg);border:1px solid var(--bnbd);border-left:4px solid var(--ac)}
.bottleneck .t{font-size:11px;letter-spacing:1px;color:var(--ac);font-weight:700;margin-bottom:7px}
.bottleneck .h{font-size:17px;font-weight:800;margin-bottom:8px;line-height:1.4}
.bottleneck .bdef{font-size:13.5px;color:#5A6478;line-height:1.75;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--bnbd);word-break:keep-all}
.bottleneck .bdef b{color:#1E2761}
.bn-go{display:block;width:100%;margin-top:14px;padding:16px;border:none;border-radius:13px;background:linear-gradient(135deg,#1E2761 0%,#33409A 100%);color:#FFF;font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;line-height:1.45;box-shadow:0 6px 18px rgba(30,39,97,.24);transition:transform .15s,box-shadow .15s}
.bn-go:active{transform:translateY(1px)}
.bn-go b{font-weight:800;color:#FFD98A}
.bfoot{font-size:13.5px;color:#1E2761;font-weight:700;text-align:center;margin-top:11px}
.axis-open{font-size:11.5px;color:#6B7393;margin:-4px 0 13px 46px;line-height:1.65}
.axis-open a{color:#2979C8;font-weight:700;text-decoration:none;border-bottom:1px solid #CFE0F3}
.q-head{font-size:14.5px;font-weight:800;color:#1A2138;margin:22px 0 5px}
.q-sub{font-size:12.5px;color:#6B7393;line-height:1.75;margin:0 0 12px;word-break:keep-all}
.q-sub b{color:#1E2761}
.todo .tq{font-size:14.5px;font-weight:800;color:#1A2138;line-height:1.45;word-break:keep-all}
.todo.done .tq{color:#5A6478}
.bottleneck .b{font-size:14px;color:#4A5568;line-height:1.7;word-break:keep-all}

/* 교차 해석 */
.cross{background:#FFF;border:1px solid #E8E8F0;border-left:4px solid #8B5CF6;border-radius:14px;padding:18px 20px;margin-bottom:12px}
.cross .src{font-size:11px;color:#8B5CF6;font-weight:700;letter-spacing:.5px;margin-bottom:7px}
.cross .txt{font-size:14.5px;color:#2D3748;line-height:1.75;word-break:keep-all}

/* 설계 시트 */

<script>
const KEY='nadaum.profile.v1';
const BASE='https://nadaumlap.github.io/nadaumneed';
/* 익명 집계 — 규준(low/mid/high 경계)과 재검사 신뢰도를 만들려면 분포가 필요하다.
   지금의 모든 경계(40/65, 34/67, 55 등)는 이론적·임시 경계다.
   아래 주소를 채우기 전까지 아무것도 보내지 않고 화면에도 뜨지 않는다.
   Google Apps Script 웹앱이나 폼 엔드포인트 주소를 넣으면 활성화된다.
   보내는 것: 리포트 ID(개인 식별 불가), 네 축 점수, 세그먼트, 문항판 번호, 날짜.
   보내지 않는 것: 문항별 응답, 설계 문장, 기록, 이름·이메일. */
const COLLECT_URL='';
/* ───────── 회원가입(선택) ─────────
   정책: 종합리포트는 누구나 익명으로, 가입은 기록을 오래 갖고 싶은 사람만.
   가입 시 받는 것은 이메일 하나. 이름은 받지 않는다. 비밀번호도 없다(매직링크).
   AUTH.url·AUTH.key가 비어 있으면 가입 관련 UI는 전혀 뜨지 않고 아무것도 불러오지 않는다.
   Supabase 프로젝트 → Settings → API 의 Project URL / anon public key 를 넣는다. */
const AUTH={url:'', key:'', table:'profiles', privacy:BASE+'/report/privacy.html'};
const SHORT={v:'v',id:'i',created:'c',updated:'u',modules:'m',designs:'g'};

/* ───────── 저장 ───────── */
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(p){try{localStorage.setItem(KEY,JSON.stringify(p))}catch(e){} if(typeof cloudQueue==='function')cloudQueue();}
function blank(){return{v:1,id:'ND-'+r4()+'-'+r4(),created:today(),updated:today(),modules:{},designs:[],checks:{},history:[]}}
function r4(){return Math.random().toString(36).slice(2,6).toUpperCase()}
function today(){return new Date().toISOString().slice(0,10)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}

/* ───────── 보관 링크 인코딩 ─────────
   형식 v1: base64url(JSON) — 키를 1글자로 줄여 길이를 압축한다.
   이 형식은 이미 발급된 링크를 깨뜨리지 않기 위해 변경하지 않는다. */
/* 모듈·필드 이름을 1~2글자로 줄여 링크 길이를 압축한다.
   이미 발급된 링크가 깨지지 않도록 이 표는 항목 추가만 하고 기존 항목은 바꾸지 않는다. */
const MK={tendency:'t',needscan:'n',noise:'x',temperament:'p',motivation:'m',noiseInner:'i',alignment:'a',authorship:'d'};
const MKr=Object.fromEntries(Object.entries(MK).map(([a,b])=>[b,a]));
const FK={ts:'s',main:'a',sub:'b',avgs:'v',overall:'o',flag:'f',
  nci:'c',d1:'1',d2:'2',d3:'3',d4:'4',influence:'n',aware:'w',weak:'k',weakVal:'y',seg:'g',
  total:'t',nunchi:'u',compare:'r',exposure:'e',top:'p',tied:'d',totalSeg:'q',snsMin:'z',branch:'h',
  axisScores:'j',ns:'N',ha:'H',rd:'R',ps:'P',sdtScore:'S',raw:'W',pct:'C',z:'Z',
  score:'l',a1:'5',a2:'6',a3:'7',a4:'8',values:'V',statement:'M',criteria:'T',qv:'Q',care:'X'};
const FKr=Object.fromEntries(Object.entries(FK).map(([a,b])=>[b,a]));
const AVGO=['A','C','S','D','E'];
function pack(p){
  const o={v:1,i:p.id.replace(/^ND-/,'').replace(/-/g,''),c:d8(p.created),u:d8(p.updated),m:{},
    g:(p.designs||[]).map(x=>[d8(x.ts),x.axis,x.text,x.id,x.ph||''])};
  const ck={};for(const k in (p.checks||{}))ck[d8(k)]=p.checks[k];
  if(Object.keys(ck).length)o.k=ck;
  /* 링크가 수천 자가 되면 일부 메신저가 잘라 버린다.
     기록은 최근 30일, 변화 스냅샷은 최근 6개만 링크에 담고 나머지는 백업 파일로 간다. */
  var cut=new Date(); cut.setDate(cut.getDate()-30); cut=cut.toISOString().slice(0,10);
  var nt={}; for(var nd in (p.notes||{})) if(nd>=cut) nt[d8(nd)]=p.notes[nd];
  if(Object.keys(nt).length)o.o=nt;
  if(p.values&&p.values.length)o.V=p.values;
  var hs=(p.history||[]).slice(-6).map(function(x){return [d8(x.t)].concat((x.a||[]).map(function(v){return v==null?-1:v})).concat([x.f||''])});
  if(hs.length)o.h=hs;
  for(const k in p.modules){
    const src=p.modules[k],dst={};
    for(const f in src){
      let val=src[f]; if(val===null||val===undefined)continue;
      if(f==='ts')val=d8(val);
      if(f==='avgs'&&typeof val==='object')val=AVGO.map(c=>val[c]);
      if(f==='z')continue;                       // 순위 산출용 파생값 — 링크에서 제외
      dst[FK[f]||f]=val;
    }
    o.m[MK[k]||k]=dst;
  }
  return b64e(JSON.stringify(o));
}
function unpack(str){
  try{
    const o=JSON.parse(b64d(str)); const mods={};
    for(const k in (o.m||{})){
      const src=o.m[k],dst={};
      for(const f in src){
        const name=FKr[f]||f; let val=src[f];
        if(name==='ts')val=d10(val);
        if(name==='avgs'&&Array.isArray(val)){const t={};AVGO.forEach((c,i)=>t[c]=val[i]);val=t}
        dst[name]=val;
      }
      mods[MKr[k]||k]=dst;
    }
    const r={v:1,id:'ND-'+String(o.i).slice(0,4)+'-'+String(o.i).slice(4),
      created:d10(o.c),updated:d10(o.u),modules:mods,
      designs:(o.g||[]).map((a,i)=>({ts:d10(a[0]),axis:a[1],text:a[2],id:typeof a[3]==='number'?a[3]:i+1,ph:a[4]||''})),
      checks:(function(){const c={};for(const k in (o.k||{}))c[d10(k)]=o.k[k];return c})(),
      notes:(function(){const c={};for(const k in (o.o||{}))c[d10(k)]=o.o[k];return c})(),
      history:(o.h||[]).map(function(a){return {t:d10(a[0]),s:'',a:a.slice(1,5).map(function(v){return v===-1?null:v}),f:(typeof a[5]==='string'?a[5]:'')}})};
    if(o.V)r.values=o.V;
    return r;
  }catch(e){return null}
}
function d8(s){return String(s||'').replace(/-/g,'')}
function d10(s){s=String(s||'');return s.length===8?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6):s}
function b64e(s){const b=new TextEncoder().encode(s);let x='';b.forEach(c=>x+=String.fromCharCode(c));
  return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const bin=atob(s);
  const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b)}

/* 복원 링크 병합 — 더 최근에 갱신된 모듈을 남긴다 */
function mergeFromUrl(){
  const q=new URLSearchParams(location.search).get('d');
  if(!q)return false;
  const inc=unpack(q); if(!inc)return false;
  const cur=load();
  if(!cur){save(inc);return true}
  save(mergeProfiles(cur,inc)); return true;
}
/* 두 프로필을 합친다 — 보관 링크 복원과 계정 동기화가 같은 규칙을 쓴다.
   모듈은 더 최근 것, 체크·기록·문장은 합집합, 히스토리는 날짜 기준 합집합. */
function mergeProfiles(cur,inc){
  if(!cur) return inc;
  if(!inc) return cur;
  const out=cur;
  inc.modules=inc.modules||{};
  for(const k in inc.modules){
    const a=cur.modules[k],b=inc.modules[k];
    if(!a||(b.ts||'')>=(a.ts||'')) out.modules[k]=b;
  }
  out.checks=out.checks||{};
  for(const k in (inc.checks||{})){
    const a=new Set(out.checks[k]||[]);(inc.checks[k]||[]).forEach(x=>a.add(x));
    out.checks[k]=[...a];
  }
  out.notes=out.notes||{};
  for(const k in (inc.notes||{})){
    out.notes[k]=Object.assign({},inc.notes[k],out.notes[k]);
  }
  var hm={};
  (out.history||[]).forEach(function(x){hm[x.t]=x});
  (inc.history||[]).forEach(function(x){if(!hm[x.t])hm[x.t]=x});
  out.history=Object.keys(hm).sort().map(function(k){return hm[k]});
  const seen=new Set((out.designs||[]).map(d=>d.ts+'|'+d.text));
  (inc.designs||[]).forEach(d=>{if(!seen.has(d.ts+'|'+d.text))(out.designs=out.designs||[]).push(d)});
  if(inc.values&&inc.values.length&&!(out.values&&out.values.length)) out.values=inc.values;
  out.updated=today(); return out;
}

/* ───────── 진단 정의 ───────── */
const DIAGS=[
  /* core:true 네 개가 지도의 네 칸을 하나씩 연다(74문항·약 23분).
     5러·기질은 칸을 열지 않고 방향과 해석을 더하는 심화 진단이다. */
  {k:'needscan',   n:'욕구 출발점 진단',   d:'16문항 · 약 5분', url:BASE+'/needscan/',    c:'#2979C8', s:'N', g:'① 나를 읽다 · N', o:'', core:true, ax:'N',  q:'내가 진짜 원하는 것은 무엇일까?'},
  {k:'noise',      n:'잡음 오염도 진단',   d:'18문항 · 약 5분', url:BASE+'/newnoise/',    c:'#3DAA6B', s:'E', g:'② 흐리게 하는 것을 덜다 · E1', o:'', core:true, ax:'E1', q:'무엇이 나를 흐리게 하고 있을까?'},
  {k:'alignment',  n:'생명성 정렬 진단',    d:'20문항 · 약 6분', url:BASE+'/alignment/',   c:'#C9983A', s:'E', g:'③ 에너지를 정렬하다 · E2', o:'', core:true, ax:'E2', q:'내 하루는 나를 살리고 있을까?'},
  {k:'authorship', n:'나다움 설계 현황 진단',d:'20문항 · 약 7분', url:BASE+'/need/',        c:'#8B5CF6', s:'D', g:'④ 내 기준으로 오늘을 쓰다 · D', o:'', core:true, ax:'D', q:'지금 나는 얼마나 내 기준으로 살고 있을까?'},
  {k:'tendency',   n:'에너지 경향성 진단',  d:'15문항 · 약 5분', url:BASE+'/5characters/', c:'#2979C8', s:'+', g:'심화 · 에너지가 흐르는 방향', o:'', core:false, q:'나는 지금 어디에 에너지를 쓰고 있을까?'},
  {k:'temperament',n:'기질·동기·잡음 진단',d:'26문항 · 약 8분', url:BASE+'/why/',         c:'#8B5CF6', s:'+', g:'심화 · 기질과 동기의 토대', o:'', core:false, q:'나는 어떤 방식으로 움직이는 사람일까?'}
];
const CHARS={A:'열정러',C:'협력러',S:'안정러',D:'장인러',E:'모험러'};
const FLOWKEY={A:'성취',C:'연결',S:'안정',D:'탐구',E:'모험'};
const NOISEAX={1:'눈치 압력',2:'비교 압력',3:'노출'};
const TEMPN={ns:'새로움에 끌리는 힘',ha:'위험을 살피는 힘',rd:'사람 반응을 읽는 힘',ps:'한 가지를 지속하는 힘'};
const DIMN={D1:'욕구의 출발점',D2:'에너지의 방향',D3:'몸의 신호',D4:'욕구의 출처 구분'};

/* ───────── 4축 산출 ───────── */
/* 한 축 = 한 진단.
   종전에는 N축이 needscan·tendency·why 세 값의 평균이었다. 두 가지 문제가 있었다.

  const picked=[], used=new Set();

}

  if(!t||!FLOWKEY[t.main])return null;
  return {key:'F', flow:t.main, seg:null, why:'flow',
          name:FLOWKEY[t.main]+' 중심의 흐름', v:null, c:'#2979C8',
          stage:'지금 시기의 에너지 경향성'};
}
const SUBDEF={N:'D1',E1:1,E2:'A2',D:'D2',F:'A'};
function subKeyOf(k,p){
  const m=(p||P).modules||{};
  if(k==='N' && m.needscan   && m.needscan.weak)   return m.needscan.weak;
  if(k==='E1'&& m.noise      && m.noise.top)       return String(m.noise.top);
  if(k==='E2'&& m.alignment  && m.alignment.weak)  return m.alignment.weak;
  if(k==='D' && m.authorship && m.authorship.weak) return m.authorship.weak;
  if(k==='F' && m.tendency && m.tendency.main) return m.tendency.main;
  return SUBDEF[k];
}
function optsOf(k,p){
  const g=OPTS[k]||OPTS.N, sk=subKeyOf(k,p);
  return g[sk]||g[SUBDEF[k]]||g[Object.keys(g)[0]];
}

     +'<div class="td">'+d.n+' · '+d.d+' · 다시 하면 최신 결과로 바뀝니다</div></div><div class="ar">다시 하기</div></a>';
  }
  return '<a class="todo'+cls+'" href="'+d.url+'"><div class="ic" style="background:'+d.c+'">'+(d.o||d.s)+'</div>'
   +'<div class="tb">'+head+'<div class="tq">'+(d.q||d.n)+'</div><div class="td">'+d.n+' · '+d.d+'</div></div>'
   +'<div class="ar">'+(st==='next'?'시작하기 →':'→')+'</div></a>';
}

/* ───────── 여정 지도 ─────────
   N.E.E.D는 동시에 존재하는 네 지표가 아니라 순차적 네 단계다(브랜드 가이드 §3-3).
   레이더는 균형을 보는 보조 도구로 내리고, 순서를 보여주는 그림을 앞에 둔다. */
const JOURNEY={
  N :{no:'①',t:'내가 원하는 것을 읽다',           en:'N · Need Scan',        open:'욕구 출발점 진단',   ourl:BASE+'/needscan/'},
  E1:{no:'②',t:'나를 흐리게 하는 것을 덜어내다',   en:'E · Eliminate Noise',  open:'잡음 오염도 진단',   ourl:BASE+'/newnoise/'},
  E2:{no:'③',t:'에너지를 중요한 곳에 정렬하다',     en:'E · Energy Alignment', open:'생명성 정렬 진단',   ourl:BASE+'/alignment/'},
  D :{no:'④',t:'내 기준으로 오늘을 쓰다',          en:'D · Daily Authorship', open:'나다움 설계 현황 진단', ourl:BASE+'/need/'}
};
const TINT={N:{bg:'#F2F7FD',bd:'#D2E3F6',glow:'rgba(41,121,200,.30)'},
            E1:{bg:'#F2FAF5',bd:'#D0EBDB',glow:'rgba(61,170,107,.30)'},
            E2:{bg:'#FDF9F0',bd:'#EFE0BC',glow:'rgba(201,152,58,.32)'},
            D:{bg:'#F7F4FE',bd:'#E0D4FB',glow:'rgba(139,92,246,.32)'},
            F:{bg:'#F2F7FD',bd:'#D2E3F6',glow:'rgba(41,121,200,.30)'}};
function journeyView(A,bn,nocap){
  const T=P.modules&&P.modules.tendency;
  const STEPS=[
    {k:'N', no:'01', t:'나를 읽다',                     v:A.N.v,  c:'#2979C8', url:BASE+'/needscan/'},
    {k:'E1',no:'02', t:'나를 흐리게 하는 것을 덜어내다', v:A.E1.v, c:'#3DAA6B', url:BASE+'/newnoise/'},
    {k:'E2',no:'03', t:'에너지를 중요한 곳에 정렬하다',  v:A.E2.v, c:'#C9983A', url:BASE+'/alignment/'},
    {k:'F', no:'04', t:'내 에너지는 지금 어디로 흐르는가', v:(T&&T.main)?((typeof CHARS!=='undefined'&&CHARS[T.main])||'확인함'):null, c:'#B0576F', url:BASE+'/5characters/'},
    {k:'D', no:'05', t:'내 기준으로 오늘을 쓰다',        v:A.D.v,  c:'#8B5CF6', url:BASE+'/need/'}
  ];
  const openN=STEPS.filter(x=>x.v!==null&&x.v!==undefined).length;
  const TINTS={N:TINT.N,E1:TINT.E1,E2:TINT.E2,D:TINT.D,F:{bg:'#FDF6F8',bd:'#EED8DF',glow:'rgba(176,87,111,.28)'}};
  let h='<div class="jmap">'+(nocap?'':'<div class="jn-cap">나의 설계 여정</div>')+'<div class="jmap-grid">';
  STEPS.forEach(function(x){
    const has=(x.v!==null&&x.v!==undefined), here=!!(bn&&bn.key===x.k), ti=TINTS[x.k]||TINT.N;
    h+='<a class="jstep'+(has?' on':'')+(here?' here':'')+'" href="'+x.url+'"'
     +' style="--jc:'+x.c+';--jbg:'+ti.bg+';--jbd:'+ti.bd+';--jglow:'+ti.glow+'">'
     +'<span class="jlock">'+(has?'\uD83D\uDD13':'\uD83D\uDD12')+'</span>'
     +'<span class="jno">'+x.no+'</span>'
     +'<span class="jt">'+x.t+'</span>'
     +'<span class="jv">'+(has?x.v:'아직 열리지 않음')+'</span></a>';
  });
  h+='<div class="jgoal'+(openN>=5?' on':'')+'">\u2691</div></div>';
  let pg;
  if(openN>=5) pg='다섯 단계가 모두 열렸습니다. 이제부터는 점수보다 <b>선의 방향</b>을 보실 차례입니다.';
  else if(openN===0) pg='아직 열린 칸이 없습니다. 어느 칸부터 여셔도 됩니다.';
  else pg='다섯 칸 중 <b>'+openN+'칸</b>이 열렸습니다. 잠긴 칸을 누르시면 그 진단으로 바로 이동합니다.';
  h+='<div class="jmap-foot">'+pg+'</div></div>';

}

   +'<div class="hc-f">'+(n?'지금까지 '+n+'개의 문장을 남기셨습니다':'1분이면 됩니다. 문장 하나만 남기시면 됩니다')+'</div>'

function coverView(done){
  const dates=done.map(d=>P.modules[d.k].ts).filter(Boolean).sort();
  let h='<div class="cover"><span class="badge">나다움 설계 리포트</span>'
   +'<h1>왜 어떤 일은 나를 살리고,<br>어떤 일은 나를 지치게 할까</h1>'
   +'<p class="lead">지금까지 하신 진단을 한자리에 모아 읽고, 오늘 시작할 설계 한 문장을 남기는 자리입니다.</p>'
   +'<div class="meta-line"><span>리포트 '+P.id+'</span><span>답한 질문 '+done.length+'개</span>';
  if(dates.length)h+='<span>'+dates[0].replace(/-/g,'.')+' ~ '+dates[dates.length-1].replace(/-/g,'.')+'</span>';
  if(P.designs.length)h+='<span>설계 문장 '+P.designs.length+'</span>';

}

function radar(A){
  const S=260,cx=S/2,cy=S/2,R=88;
  const ks=['N','E1','E2','D'];
  const ang=ks.map((_,i)=>(Math.PI*2*i/4)-Math.PI/2);
  let g='';
  [.25,.5,.75,1].forEach(l=>{
    const pts=ang.map(a=>(cx+R*l*Math.cos(a)).toFixed(1)+','+(cy+R*l*Math.sin(a)).toFixed(1)).join(' ');
    g+='<polygon points="'+pts+'" fill="none" stroke="#E8E8F0" stroke-width="1"/>';
  });
  ang.forEach(a=>{g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a)).toFixed(1)+'" stroke="#E8E8F0"/>'});
  const pts=ks.map((k,i)=>{const v=A[k].v===null?0:A[k].v/100;
    return (cx+R*v*Math.cos(ang[i])).toFixed(1)+','+(cy+R*v*Math.sin(ang[i])).toFixed(1)}).join(' ');
  g+='<polygon points="'+pts+'" fill="rgba(41,121,200,.14)" stroke="#2979C8" stroke-width="2" stroke-dasharray="'+
     (ks.some(k=>A[k].v===null)?'5 4':'0')+'"/>';
  ks.forEach((k,i)=>{const a=A[k],v=a.v===null?0:a.v/100;
    g+='<circle cx="'+(cx+R*v*Math.cos(ang[i])).toFixed(1)+'" cy="'+(cy+R*v*Math.sin(ang[i])).toFixed(1)+'" r="4" fill="'+(a.v===null?'#C4CBDA':a.c)+'"/>';
    const lx=cx+(R+26)*Math.cos(ang[i]), ly=cy+(R+26)*Math.sin(ang[i]);
    g+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="middle" font-family="Montserrat,sans-serif" font-size="12" font-weight="800" fill="'+(a.v===null?'#C4CBDA':a.c)+'">'+k+'</text>';
  });
  return '<div class="radar-box"><svg viewBox="0 0 '+S+' '+S+'" xmlns="http://www.w3.org/2000/svg">'+g+'</svg></div>';
}

/* 표지 질문("왜 어떤 일은 나를 살리고, 어떤 일은 나를 지치게 할까")에
   그 사람의 답을 한 문장으로 돌려준다. 정보는 이미 갖고 있었는데 쓰지 않고 있었다. */
function answerLine(A,bn){
  const m=P.modules;
  let alive=null, drain=null;
  if(m.tendency&&m.tendency.flag!=='low'&&FLOWKEY[m.tendency.main]) alive=FLOWKEY[m.tendency.main]+' 쪽으로 흐를 때';
  else{
    const hi=AXORD.filter(k=>A[k].v!==null).sort((a,b)=>A[b].v-A[a].v)[0];
    if(hi&&A[hi].v>=50) alive={N:'내가 무엇을 원하는지 분명할 때',E1:'바깥 소리가 덜 들어올 때',
                               E2:'하루가 내 리듬에 맞을 때',D:'내 기준으로 정할 때'}[hi];
  }
  if(m.noise&&m.noise.top) drain=NOISEAX[m.noise.top]+'이 들어올 때';
  else if(bn&&bn.key!=='F') drain={N:'무엇을 원하는지 흐릴 때',E1:'바깥 소리가 크게 들어올 때',
                     E2:'하루가 내 리듬과 어긋날 때',D:'남의 기준으로 정할 때'}[bn.key];
  if(!alive&&!drain)return '';
  let t='';
  if(alive&&drain) t='지금 여러분을 <b>살리는 것</b>은 '+alive+'이고, <b>지치게 하는 것</b>은 '+drain+'입니다.';
  else if(alive)   t='지금 여러분을 <b>살리는 것</b>은 '+alive+'입니다. 지치게 하는 쪽은 잡음 오염도 진단을 마치시면 함께 읽어 드립니다.';
  else             t='지금 여러분을 <b>지치게 하는 것</b>은 '+drain+'입니다. 살리는 쪽은 에너지 경향성 진단을 마치시면 함께 읽어 드립니다.';
  return '<div class="answer"><div class="al">이 질문에 대한 지금의 답</div><p>'+t+'</p></div>';
}
/* 강점 카드 — 리포트가 가장 낮은 곳만 조명하면 제안이 '결핍 보완'으로 읽힌다.
   Seligman et al.(2005): 대표 강점을 확인하고 새 방식으로 쓰는 과제는
   다섯 개 개입 중 6개월까지 효과가 유지된 두 개 중 하나였다. */
function strengthCard(A,bn){
  const m=P.modules, bits=[];
  // 세그먼트가 low인 축은 '강점'이 아니다. 점수만 보고 덜 낮은 쪽을 강점으로 부르면 안 된다.
  const hi=AXORD.filter(k=>A[k].v!==null&&(!bn||k!==bn.key)&&segOf(P,k,A)!=='low').sort((a,b)=>A[b].v-A[a].v)[0];
  if(hi&&A[hi].v!==null) bits.push({h:A[hi].name+' '+A[hi].v, p:{N:'무엇을 원하는지 스스로 꽤 분명하게 알고 계십니다.',
      E1:'바깥에서 들어오는 소리에 덜 흔들리는 편입니다.',
      E2:'하루가 이미 어느 정도 내 리듬에 맞물려 있습니다.',
      D:'내 기준으로 오늘을 쓰는 힘이 이미 있습니다.'}[hi], c:A[hi].c});
  // 흐름 설계(F)일 때는 아래 카드가 이미 흐름을 제목으로 쓰므로 여기서는 뺀다
  if(m.tendency&&m.tendency.flag!=='low'&&FLOWKEY[m.tendency.main]&&!(bn&&bn.key==='F'))
    bits.push({h:FLOWKEY[m.tendency.main]+' 중심의 흐름', p:'지금 시기에 힘이 나는 방향입니다. 새 습관을 만들 때 이 결에 얹으면 덜 애씁니다.', c:'#2979C8'});
  if(m.temperament){
    const t=m.temperament,ord=[['ns',t.ns],['ha',t.ha],['rd',t.rd],['ps',t.ps]].sort((a,b)=>b[1]-a[1]);
    bits.push({h:TEMPN[ord[0][0]], p:'기질에서 가장 두드러진 힘입니다. 오래 버텨 온 방식이니 바꾸기보다 쓰는 편이 낫습니다.', c:'#8B5CF6'});
  }
  if(!bits.length)return '';
  return '<div class="sec">'+sn()+'<h2>지금 가장 잘 작동하는 것</h2>'
   +'<p class="sub">설계는 부족한 것을 메우는 일이 아니라, 이미 있는 것 위에 얹는 일입니다. 먼저 가진 것을 봅니다.</p>'
   +'<div class="str-wrap">'+bits.slice(0,3).map(function(b){
      return '<div class="str" style="--sc:'+b.c+'"><div class="sh">'+b.h+'</div><div class="sp">'+b.p+'</div></div>';
   }).join('')+'</div></div>';
}

/* 부주의 응답이 잡힌 진단이 있으면 결과를 지우지 않고 참고용임을 알린다. */
function careNote(){
  const bad=DIAGS.filter(d=>P.modules[d.k]&&P.modules[d.k].care===1);
  if(!bad.length)return '';
  return '<div class="carenote"><b>이 결과는 참고용으로 보십시오</b>'
   +bad.map(d=>d.n).join(' · ')+'에서 같은 칸을 오래 이어서 누르신 흔적이 있습니다. '
   +'문항을 빠르게 넘기셨을 수 있어 점수가 실제와 다를 수 있습니다. 시간이 있으실 때 다시 해보시면 더 정확해집니다.</div>';
}

     +'<div class="axis-stage">'+a.stage+'</div>'
     +'<div class="axis-track"><div class="axis-fill" style="width:'+(has?a.v:0)+'%;background:'+(has?a.c:'#E8E8F0')+'"></div></div></div>'
     +'<div class="axis-val">'+(has?a.v:'\u2014')+'</div></div>';
    if(!has){

    }
  });
  h+='</div>';
  h+='<div class="guard">점수가 낮다고 나쁜 것도, 높다고 좋은 것도 아닙니다. 지금 나에게 필요한 <b>출발점</b>을 찾는 것이 목적입니다.</div>';

     +'<div class="t">지금 시기의 에너지 경향성</div>'

     +'<div class="bdef">'+AXIS_DEF.F+'</div>'
     +'<div class="b">아직 어느 칸도 열리지 않아 <b>어디부터 손대면 좋을지</b>는 말씀드릴 수 없습니다. '
     +'대신 지금 힘이 나는 결이 어느 쪽인지는 알고 있으니, <b>그 결 위에 오늘 하루를 얹는 설계</b>부터 시작하시면 됩니다. '
     +'첫 칸을 여시면 그때부터는 여러분의 지도에 맞춘 설계가 나옵니다.'
     +'<br><span class="bwhy">에너지 경향성은 나침반이고, 네 칸은 지도입니다. 나침반만으로도 오늘 한 걸음은 뗄 수 있습니다.</span></div>'
     +'<button class="bn-go no-print" onclick="openDesign()">오늘의 설계 시작하기 \u2192</button>'

  }
  else if(bn){
    const seq=AXIS_SEQ.join(' \u2192 '), t=TINT[bn.key]||TINT.N;

      ? '네 단계 가운데 <b>'+bn.name+'</b>'+(jong(bn.name)?'이':'가')+' 아직 낮은 구간이고, 앞 단계 중 가장 먼저 나오는 자리입니다.'
      : (bn.why==='mid'
      ? '낮게 나온 축은 없습니다. 앞 단계 중 아직 더 볼 여지가 있는 <b>'+bn.name+'</b>부터 보시면 좋습니다.'
      : '네 축 모두 안정적인 구간입니다. 무엇을 고치기보다 <b>'+bn.name+'</b>에서 지금 되고 있는 것을 유지하는 설계를 권합니다.');
    h+='<div class="sec">'+sn()+'<h2>지금 내가 먼저 살펴볼 곳</h2>'
     +'<div class="bottleneck" style="--ac:'+bn.c+';--bnbg:'+t.bg+';--bnbd:'+t.bd+'">'
     +'<div class="t">'+((JOURNEY[bn.key]||{}).en||'')+'</div>'
     +'<div class="h">'+bn.name+' '+bn.v+'</div>'
     +'<div class="bdef">'+(AXIS_DEF[bn.key]||'')+'</div>'
     +'<div class="b">'+lead+' 이 숫자는 <b>잘하고 있지 못하다</b>는 뜻이 아니라, '
     +'지금의 나를 조금 더 이해하면 <b>삶의 방향이 가장 크게 달라질 수 있는 곳</b>이라는 뜻입니다.'
     +(sname?' 그 안에서도 지금 가장 낮은 것은 <b>'+sname+'</b>입니다. 아래 설계는 그 자리에 맞춰 제안됩니다.':'')
     +'<br><span class="bwhy">네 단계는 순서대로(<b>'+seq+'</b>) 이어질 때 힘이 붙기 때문에, 점수가 가장 낮은 축이 아니라 <b>앞 단계 중 아직 낮은 축</b>을 먼저 봅니다. 네 진단은 묻는 방식이 서로 달라 점수를 나란히 놓고 비교할 수 없습니다.</span></div>'
     +'<button class="bn-go no-print" onclick="openDesign()">오늘의 설계 시작하기 \u2192</button>'
     +'<div class="bfoot">오늘의 설계는 1분이면 됩니다. 한 문장만 남기시면 됩니다.</div></div></div>';
  }
  h+='<div class="sec">'+sn()+'<h2>나의 설계 여정</h2>'
   +'<p class="sub">나다움 설계는 네 단계로 이어집니다. 지금 어디까지 열렸는지 한눈에 보십시오.</p>'
   +journeyView(A,bn,true)
   +nextStepCard()
   +'</div>';
  return h;
}
/* 다음 한 개만 제안한다. 선택지가 많을수록 시작 자체를 미룬다(Iyengar & Lepper, 2000). */
function nextStepCard(){
  const core=DIAGS.filter(d=>d.core), todo=core.filter(d=>!P.modules[d.k]);
  if(!todo.length){
    const ext=DIAGS.filter(d=>!d.core&&!P.modules[d.k]);
    if(!ext.length) return '<div class="nextcard done">여섯 질문에 모두 답하셨습니다. 이제는 <a href="#record">오늘의 실천</a>을 쌓는 자리입니다.</div>';
    return '<div class="nextcard"><div class="nl">네 칸이 모두 열렸습니다</div>'
      +'<div class="nq">더 또렷하게 보고 싶으시면 심화 질문이 남아 있습니다.</div>'
      +'<a class="nb" href="#read">심화 질문 보기 \u2192</a></div>';
  }
  const d=todo[0], n=core.length-todo.length;
  return '<div class="nextcard"><div class="nl">'+(n?'다음 칸':'여기서 시작하시면 됩니다')+' · '+d.d+'</div>'
   +'<div class="nq">'+d.q+'</div>'
   +'<a class="nb" href="'+d.url+'">'+d.n+' 시작하기 \u2192</a>'
   +(n?'<div class="nn">오늘은 여기까지 하셔도 됩니다. 다음 칸은 언제 열어도 이어집니다.</div>':'')
   +'</div>';
}

function readView(A,cr,done){
  const m=P.modules;
  const core=DIAGS.filter(d=>d.core), ext=DIAGS.filter(d=>!d.core);
  const cdone=core.filter(d=>m[d.k]).length;
  const ctodo=core.filter(d=>!m[d.k]);
  const STEPMSG=['어느 칸부터 여셔도 됩니다.','한 칸이 열렸습니다. 나에 대해 한 가지를 발견하셨습니다.',
                 '두 칸이 열렸습니다. 나의 패턴이 조금씩 보이기 시작합니다.',
                 '세 칸이 열렸습니다. 하나만 더 답하시면 네 축이 모두 이어집니다.',''];
  let qs;
  if(cdone>=core.length) qs='네 칸이 모두 열렸습니다. 아래 심화 질문은 방향과 이유를 더해 줍니다. 하지 않으셔도 리포트는 온전합니다.';
  else qs=(STEPMSG[cdone]||'')+' 네 개를 한 번에 하실 필요는 없습니다. 하나에 답할 때마다 지도가 한 칸씩 밝아집니다.';

  let h='<div class="sec">'+sn()+'<h2>나를 읽는 네 개의 질문</h2>'
   +'<p class="sub">네 칸을 하나씩 여는 기본 질문 네 개입니다. 모두 마치면 78문항, 약 24분입니다. '+qs+'</p>';
  if(ctodo.length){
    h+='<div class="q-grp">여기서 이어 가시면 됩니다</div>';
    h+=todoRow(ctodo[0],'next');
    if(ctodo.length>1){
      h+='<div class="q-grp">그 다음 칸</div>';
      ctodo.slice(1).forEach(d=>{h+=todoRow(d,'dim')});
    }
  }
  const cfin=core.filter(d=>m[d.k]);
  if(cfin.length){
    h+='<div class="q-grp">이미 답하신 질문</div>';
    cfin.forEach(d=>{h+=todoRow(d)});
  }
  h+='</div>';

  h+='<div class="sec">'+sn()+'<h2>더 또렷하게 보고 싶다면</h2>'
   +'<p class="sub">아래 두 질문은 새로운 칸을 열지는 않습니다. 대신 <b>에너지가 어느 쪽으로 흐르는지</b>와 '
   +'<b>왜 그렇게 움직이는지</b>를 더해, 위 네 칸의 해석을 훨씬 촘촘하게 만듭니다.</p>';
  ext.forEach(d=>{ h+=todoRow(d, m[d.k]?'':'dim'); });
  h+='</div>';

  h+='<div class="sec">'+sn()+'<h2>지금까지 읽은 것</h2>'
   +'<p class="sub">답하신 질문이 어느 칸을 열었는지 보여줍니다. 점수와 지도는 <a href="#map">나의 지도</a>에 있습니다.</p>';
  h+='<div class="axes-wrap">';
  ['N','E1','E2','D'].forEach(k=>{
    const a=A[k],has=a.v!==null;
    h+='<div class="axis-lite'+(has?'':' empty')+'"><span class="al-k" style="'+(has?'color:'+a.c:'')+'">'+k+'</span>'
     +'<span class="al-n">'+a.name+'</span>'
     +'<span class="al-v"'+(has?' style="color:'+a.c+'"':'')+'>'+(has?a.v:'\u2014')+'</span></div>';
    const chips=(a.feeds||[]).map(function(fk){
      const d=DIAGS.filter(x=>x.k===fk)[0]; if(!d)return '';
      const ok=!!P.modules[fk];
      return '<span class="feed'+(ok?' on':'')+'">'+(ok?'\u2713 ':'')+d.n.replace(' 진단','')+'</span>';
    }).join('');
    h+='<div class="feed-row">'+chips+(has?'':'<span class="feed-lab">아직 열지 않음</span>')+'</div>';
  });
  h+='</div>';
  if(m.tendency){
    const low=(m.tendency.flag==='low');
    h+='<div class="card"><div style="font-size:11px;letter-spacing:1px;color:#6B7393;font-weight:700;margin-bottom:7px">지금 시기의 에너지 경향성</div>'
     +(low
       ? '<div style="font-size:16px;font-weight:800;line-height:1.5">지금은 어느 한 방향으로 쏠려 있지 않습니다</div>'
        +'<div style="font-size:13px;color:#6B7393;margin-top:6px">다섯 방향의 차이가 크지 않다는 뜻입니다. 좋고 나쁨이 아니라, 지금이 여러 쪽을 고르게 쓰는 시기라는 신호입니다.</div>'
       : (close2(m.tendency)
         ? '<div style="font-size:16px;font-weight:800;line-height:1.5">지금은 '+FLOWKEY[m.tendency.main]+'과 '+FLOWKEY[m.tendency.sub]+', 두 흐름이 비슷한 세기입니다</div>'
          +'<div style="font-size:13px;color:#6B7393;margin-top:6px">'+CHARS[m.tendency.main]+' 패턴 · '+CHARS[m.tendency.sub]+' 패턴 — 두 값의 차이가 문항 한 개 차이 안쪽이라 순위를 단정하지 않습니다. 둘 다 지금의 나로 읽으시면 됩니다.</div>'
         : '<div style="font-size:16px;font-weight:800;line-height:1.5">지금 에너지는 '+FLOWKEY[m.tendency.main]+' 중심으로 흐르고 있습니다'
          +(m.tendency.sub?'<br><span style="font-size:14px;font-weight:700;color:#4A5568">보조 흐름은 '+FLOWKEY[m.tendency.sub]+' 쪽입니다</span>':'')+'</div>'
          +'<div style="font-size:13px;color:#6B7393;margin-top:6px">'+CHARS[m.tendency.main]+' 패턴'
          +(m.tendency.sub?' + '+CHARS[m.tendency.sub]+' 패턴':'')+' · 고정된 유형이 아니라 지금 시기의 흐름입니다.</div>'))
     +'</div>';
  }
  const vcTop=valueCardFromDiag();
  if(vcTop)h+=vcTop;
  h+='</div>';
  if(cr&&cr.length>=1) h+=crossView(cr,done.length);
  return h;
}

function changeView(){
  const H=(P.history||[]);
  let h='<div class="sec">'+sn()+'<h2>처음의 나 \u2192 지금의 나</h2>';
  if(H.length<2){
    h+='<p class="sub">같은 질문에 시간을 두고 다시 답하시면, 그 사이에 무엇이 달라졌는지 여기에 남습니다.</p>'
     +'<div class="empty-tab">지금은 첫 기록 한 개만 있습니다.<br>한 달 뒤 또는 한 분기 뒤에 다시 답해 보세요.<br>'
     +'이전 점수가 사라지지 않고 나란히 남습니다.'
     +'<a class="btn ghost" href="#record" style="text-decoration:none;margin-top:14px;display:inline-block">다시 볼 날짜 정해 두기 \u2192</a></div></div>';
    return h;
  }
  const first=H[0], last=H[H.length-1];
  h+='<p class="sub">'+String(first.t).replace(/-/g,'.')+'에 처음 답하셨고, 가장 최근 기록은 '+String(last.t).replace(/-/g,'.')+'입니다.</p>';
  let anyMix=false;
  TRAX.forEach(function(ax,ai){
    let f=null,l=null,fi=-1,li=-1;
    for(let i=0;i<H.length;i++){ if(H[i].a[ai]!=null){ f=H[i].a[ai]; fi=i; break } }
    for(let j=H.length-1;j>=0;j--){ if(H[j].a[ai]!=null){ l=H[j].a[ai]; li=j; break } }
    if(f==null||l==null)return;
    // 이 축을 만든 진단이 중간에 바뀌었으면 두 값은 같은 자로 잰 것이 아니다
    const _ff=String(H[fi].f||'').split('|'), _lf=String(H[li].f||'').split('|');
    const fc=_ff[ai]||'', lc=_lf[ai]||'';
    const mixed=!!(fc&&lc&&fc!==lc);
    if(mixed)anyMix=true;
    const d=l-f, sgn=mixed?'비교 보류':(d>0?'+'+d:(d<0?String(d):'변화 없음'));
    const cls=mixed?'tflat':(d>2?'tup':(d<-2?'tdown':'tflat'));
    h+='<div class="fnn"><div><div class="fl">처음의 나</div><div class="fd">'+String(H[fi].t).slice(2).replace(/-/g,'.')+'</div>'
     +'<div class="fv">'+f+'</div><div class="fu">'+ax.n+'</div></div>'
     +'<div style="border-color:'+ax.c+'44"><div class="fl" style="color:'+ax.c+'">지금의 나</div><div class="fd">'+String(H[li].t).slice(2).replace(/-/g,'.')+'</div>'
     +'<div class="fv" style="color:'+ax.c+'">'+l+'</div><div class="fu '+cls+'">'+sgn+'</div></div>'
     +'<div class="nxt"><div class="fl">다음의 나</div><div class="fd">아직</div>'
     +'<div class="fv">?</div><div class="fu">다시 답하면</div></div></div>';
  });
  if(anyMix) h+='<div class="guard">중간에 이 축을 재는 진단이나 문항이 바뀐 칸이 있어 <b>비교 보류</b>로 두었습니다. '
   +'2026년 9월에 <b>욕구 출발점 진단이 20문항으로 개정</b>되었고, 기질·동기 진단의 채점식도 함께 손봤습니다. '
   +'같은 문항으로 다시 답하시면 그때부터 비교가 시작됩니다.</div>';
  h+='</div>';
  h+=trendView();
  h+='<div class="sec">'+sn()+'<h2>다음의 나</h2>'
   +'<p class="sub">변화는 다시 답해야 보입니다. 다음에 볼 날짜를 정해 두시면 그날 알림이 옵니다.</p>'
   +'<a class="btn" href="#record" style="display:block;text-align:center;text-decoration:none">다시 볼 날짜 정해 두기 \u2192</a></div>';
  return h;
}

function crossView(cr,n){

   +'<p class="sub">진단 하나만으로는 나올 수 없는 문장들입니다. 두 진단이 만나는 자리에서만 보이는 것을 적었습니다.</p>';

/* ───────── 데일리 체크 ───────── */
function dkey(d){return d.toISOString().slice(0,10)}
function checksOf(day){return (P.checks&&P.checks[day])||[]}
function noteOf(day,id){return (P.notes&&P.notes[day]&&P.notes[day][id])||''}
function setNote(id,val){
  const day=today(); P.notes=P.notes||{};
  const v=String(val||'').slice(0,120).trim();
  if(v){ P.notes[day]=P.notes[day]||{}; P.notes[day][id]=v; }
  else if(P.notes[day]){ delete P.notes[day][id]; if(!Object.keys(P.notes[day]).length)delete P.notes[day]; }
  P.updated=day; save(P);
}
function noteCount(){let n=0;for(const d in (P.notes||{}))n+=Object.keys(P.notes[d]).length;return n}
function toggleCheck(id){
  const day=today();
  P.checks=P.checks||{};
  const arr=(P.checks[day]||[]).slice();
  const at=arr.indexOf(id);
  if(at>=0)arr.splice(at,1);else arr.push(id);
  if(arr.length)P.checks[day]=arr;else delete P.checks[day];
  P.updated=day;save(P);render();
}
function weekDays(){
  const out=[],now=new Date();
  const dow=(now.getDay()+6)%7;               // 월=0
  const mon=new Date(now);mon.setDate(now.getDate()-dow);
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);out.push(d)}
  return out;
}
function streakStats(){
  const total=P.designs.length||1;
  let kept=0,days=0,run=0,best=0,cur=0;
  const keys=Object.keys(P.checks||{}).sort();
  const first=keys.length?new Date(keys[0]):new Date();
  const span=Math.max(1,Math.round((new Date(today())-first)/86400000)+1);
  for(let i=0;i<span;i++){
    const d=new Date(first);d.setDate(first.getDate()+i);
    const n=checksOf(dkey(d)).length;
    if(n>0){days++;kept+=n;run++;if(run>best)best=run}else run=0;
  }
  // 오늘 기준 연속
  cur=0;
  for(let i=0;;i++){
    const d=new Date();d.setDate(d.getDate()-i);
    if(checksOf(dkey(d)).length>0)cur++;else break;
    if(i>400)break;
  }
  return{span,days,kept,best,cur,total};
}
function dailyView(){
  if(!P.designs.length)return '';
  const day=today(),on=checksOf(day);
  const wd=['월','화','수','목','금','토','일'];
  const now=new Date();
  const dnames=['일','월','화','수','목','금','토'];
  let h='<div class="sec" id="sec-daily">'+sn()+'<h2>오늘의 실천 — 기록하는 곳</h2>'
   +'<div class="rec-card"><span class="rec-step">여기가 기록하는 자리입니다</span>'
   +'<h3>오늘 실행한 내용을 한 줄로 남겨 두세요</h3>'
   +'<p>체크는 지켰다는 표시일 뿐이고, 실제로 남는 것은 이 한 줄들입니다. '
   +'한 줄씩 쌓이면 작은 여러분의 실행 역사가 됩니다. 못 적은 날이 있어도 괜찮습니다.</p></div>';
  h+='<div class="daily-change no-print"><button onclick="openDesign()">문장 바꾸거나 새로 추가하기</button></div>';
  h+='<div class="today-box"><div class="today-date">'+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+dnames[now.getDay()]+'요일</div>';
  P.designs.forEach((d,i)=>{
    const isOn=on.includes(d.id), nv=noteOf(day,d.id);
    h+='<div class="chk-wrap">'
      +'<button class="chk'+(isOn?' on':'')+'" onclick="toggleCheck('+d.id+')">'
      +'<span class="box"></span><span class="ct">'+esc(d.text)+'</span></button>'
      +'<div class="note-row'+((isOn||nv)?' open':'')+'" id="nr'+d.id+'">'
      +'<label>오늘의 한 줄 <span>· 비워 두셔도 됩니다</span></label>'
      +'<input class="note-in" id="ni'+d.id+'" type="text" maxlength="120" value="'+esc(nv)+'" placeholder="'+esc(d.ph||'예) 오늘 무엇을 보았는지 한 줄로')+'"'
      +' oninput="setNote('+d.id+',this.value)">'
      +'</div></div>';
  });
  h+='</div>';
  // 주간 그리드
  const days=weekDays(),tot=P.designs.length;
  h+='<div class="week"><h4>이번 주</h4><div class="wk-grid">';
  days.forEach((d,i)=>{
    const k=dkey(d),n=checksOf(k).length,isFuture=k>day;
    const cls=n===0?'':(n>=tot?'full':'part');
    h+='<div class="wk-cell"><div class="wk-dot '+cls+(k===day?' today':'')+'">'
      +(isFuture?'':(n>0?n:''))+'</div><div class="wk-lab">'+wd[i]+'</div></div>';
  });
  h+='</div>';
  /* '연속 실천 중 0일'은 하루만 거르면 뜨고, 바로 옆의 "못 적은 날이 있어도 괜찮습니다"와
     같은 화면에서 충돌한다. 주간 달성과 누적일을 기본으로 두고,
     연속 카운트는 7일 이상일 때만 보여 준다. */
  const st=streakStats();
  const wk=weekDays().filter(d=>checksOf(dkey(d)).length>0).length;
  h+='<div class="streak">'
   +'<div><div class="sv">'+wk+'/7일</div><div class="sl">이번 주 실천</div></div>'
   +'<div><div class="sv">'+st.days+'일</div><div class="sl">지금까지 실천한 날</div></div>'
   +(st.cur>=7?'<div><div class="sv">'+st.cur+'일</div><div class="sl">연속 실천 중</div></div>':'')
   +'</div>';
  h+='</div></div>';
  return h;
}

/* 우선가치 귀납 */
/* 우선가치 목록 — 나다움 설계 현황 진단(need)과 동일한 9개.
   종전에는 설계 문장을 키워드 부분 일치로 훑어 '후보'를 자동 제시했는데,
   목록에 '끄','쉬','말','새로' 같은 조각이 있어 '끄적이다','쉬운','말고'에도
   반응했고, 리포트 자체가 반복 쓰는 '기록'이 성장 가치로 잡혔다.
   자동 귀납을 걷어내고, 사용자가 자기 문장을 다시 읽고 직접 고르게 한다. */
const VALUE_LIST=[

  {k:'성장',d:'어제보다 나아지는 것'},{k:'성취',d:'목표를 이뤄내는 것'},
  {k:'안정',d:'흔들리지 않는 리듬을 갖는 것'},{k:'기여',d:'누군가에게 보탬이 되는 것'},
  {k:'정직',d:'숨기지 않고 그대로 있는 것'}
];

function toggleValue(k){

function trendView(){
  var H=(P.history||[]);
  var h='<div class="sec" id="sec-trend">'+sn()+'<h2>변화 기록</h2>';
  if(H.length<2){
    h+='<p class="sub">한 달 뒤, 한 분기 뒤, 또는 나에게 큰 변화가 있을 때 같은 진단을 다시 해 보세요. '
      +'그때부터 이 자리에 네 축이 어떻게 움직였는지 선으로 그려집니다.</p>'
      +'<div class="trend-empty">지금은 첫 기록 한 개만 있습니다.<br>'
      +'다시 진단하시면 이전 점수가 사라지지 않고 나란히 남습니다.</div></div>';
    return h;
  }
  var n=H.length, X0=36, X1=306, Y0=14, Y1=150;
  var px=function(i){ return n===1?(X0+X1)/2 : X0+i*(X1-X0)/(n-1) };
  var py=function(v){ return Y1-(v/100)*(Y1-Y0) };
  var g='';
  [0,25,50,75,100].forEach(function(v){
    var y=py(v);
    g+='<line x1="'+X0+'" y1="'+y+'" x2="'+X1+'" y2="'+y+'" stroke="#EDF0F6" stroke-width="1"/>'
      +'<text x="'+(X0-7)+'" y="'+(y+3.5)+'" font-size="9" fill="#6B7393" text-anchor="end">'+v+'</text>';
  });
  TRAX.forEach(function(ax,ai){
    var segs=[],cur=[];
    H.forEach(function(e,i){
      var v=(e.a||[])[ai];
      if(v==null){ if(cur.length)segs.push(cur); cur=[]; }
      else cur.push([px(i),py(v)]);
    });
    if(cur.length)segs.push(cur);
    segs.forEach(function(sg){
      if(sg.length>1){
        g+='<polyline fill="none" stroke="'+ax.c+'" stroke-width="2.2" stroke-linecap="round" '
          +'stroke-linejoin="round" points="'+sg.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ')+'"/>';
      }
      sg.forEach(function(q,j){
        var lastPt=(sg===segs[segs.length-1]&&j===sg.length-1);
        g+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="'+(lastPt?3.4:2.4)+'" fill="#fff" stroke="'+ax.c+'" stroke-width="'+(lastPt?2.4:1.8)+'"/>';
      });
    });
  });
  var step=n<=5?1:Math.ceil(n/4);
  H.forEach(function(e,i){
    if(i%step!==0 && i!==n-1) return;
    var lb=String(e.t).slice(5).replace('-','.');
    g+='<text x="'+px(i).toFixed(1)+'" y="167" font-size="9.5" fill="#6B7393" text-anchor="middle">'+lb+'</text>';
  });
  h+='<p class="sub">진단을 다시 하실 때마다 한 점씩 찍힙니다. 위로 갈수록 그 축이 선명해진 것입니다.</p>'
   +'<div class="trend-box"><svg viewBox="0 0 320 176" xmlns="http://www.w3.org/2000/svg">'+g+'</svg>'
   +'<div class="trend-leg">'+TRAX.map(function(a){
       return '<span><i style="background:'+a.c+'"></i>'+a.n+'</span>'}).join('')+'</div></div>';
  var first=H[0], last=H[n-1], deltas=[];
  h+='<div class="trend-delta">'+TRAX.map(function(ax,ai){
    var f=null,l=null;
    for(var i=0;i<n;i++){ if(H[i].a[ai]!=null){ f=H[i].a[ai]; break } }
    for(var j=n-1;j>=0;j--){ if(H[j].a[ai]!=null){ l=H[j].a[ai]; break } }
    var body;
    if(f==null||l==null){ body='<div class="tdv tflat">—</div>'; }
    else{
      var d=l-f; deltas.push({n:ax.n,d:d});
      var cls=d>2?'tup':(d<-2?'tdown':'tflat');
      var sgn=d>0?'+'+d:(d<0?String(d):'변화 없음');
      body='<div class="tdv '+cls+'">'+l+'<span style="font-size:11.5px;font-weight:600;margin-left:6px">'+sgn+'</span></div>';
    }
    return '<div><div class="tdn">'+ax.n+'</div>'+body+'</div>';
  }).join('')+'</div>';
  var span=String(first.t).replace(/-/g,'.')+' → '+String(last.t).replace(/-/g,'.');
  var note='<b>'+span+'</b> 사이의 변화입니다. ';
  if(deltas.length){
    deltas.sort(function(a,b){return b.d-a.d});
    var up=deltas[0], dn=deltas[deltas.length-1];
    if(up.d>2) note+=jo(up.n,'이','가')+' 가장 많이 올랐습니다. ';
    if(dn.d<-2) note+=jo(dn.n,'은','는')+' 내려갔습니다. 이번 달에 먼저 볼 곳입니다.';
    else if(up.d<=2) note+='네 축 모두 큰 변동은 없습니다. 지금 리듬이 유지되고 있다는 뜻입니다.';
  }
  note+='<br>점수 자체보다 <b>선의 방향</b>을 보세요. 한 번의 점수는 그날의 상태이고, 이어진 선이 여러분의 기록입니다.';
  h+='<div class="trend-note">'+note+'</div></div>';
  return h;
}

function bindDesign(bn){

  box.querySelectorAll('.m-pick').forEach(b=>{
    b.onclick=()=>{

    const text=document.getElementById('w1').value+' '+document.getElementById('w2').value+' '+what;
    P.designs.push({id:newDesignId(),ts:today(),axis:bn?bn.key:'N',text:text,ph:pickPh||''});

    render();

function newDesignId(){

function delDesign(i){
  const d=P.designs[i];
  P.designs.splice(i,1);

function icsFold(line){
  // RFC 5545 — 한 줄 75옥텟 제한. UTF-8 이므로 바이트 기준으로 접고, 이어지는 줄은 공백으로 시작한다.
  const enc=new TextEncoder(), out=[]; let cur='', bytes=0;
  for(const ch of line){
    const n=enc.encode(ch).length;
    if(bytes+n>73){ out.push(cur); cur=' '; bytes=1; }
    cur+=ch; bytes+=n;
  }
  out.push(cur);
  return out.join('\r\n');
}
function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function makeICS(mode){
  mode=mode||'once';
  const MI={once:{lab:'4주 뒤',rr:'',fn:'4주점검'},
            month:{lab:'매달',rr:'RRULE:FREQ=MONTHLY;COUNT=12',fn:'매달점검'},
            quarter:{lab:'3개월마다',rr:'RRULE:FREQ=MONTHLY;INTERVAL=3;COUNT=8',fn:'분기점검'}}[mode];
  const d=new Date();d.setDate(d.getDate()+28);
  const ymd=d.toISOString().slice(0,10).replace(/-/g,'');
  const nx=new Date(d);nx.setDate(nx.getDate()+1);
  const short=BASE+'/report/';
  const keep=keepUrl();
  const desc=(mode==='once'?'4주 전 남기신 설계 문장을 다시 봅니다.':'지난번 남기신 설계 문장을 다시 봅니다. 진단을 다시 하시면 변화 기록에 점이 하나 더 찍힙니다.')+'\n\n'
    +'· 진단하셨던 기기·브라우저에서 여시면 그대로 이어집니다: '+short+'\n\n'
    +'· 기기를 바꾸셨거나 결과가 사라졌다면 아래 보관 링크로 여세요:\n'+keep;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//나다움설계연구소//NEED//KO','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT','UID:need-'+P.id+'-'+mode+'-'+ymd+'@nadaumlap.github.io',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
    'DTSTART;VALUE=DATE:'+ymd,'DTEND;VALUE=DATE:'+nx.toISOString().slice(0,10).replace(/-/g,''),
    'SUMMARY:'+icsEsc('그 문장, 지켜졌나요? — 나다움 설계 점검'),
    'DESCRIPTION:'+icsEsc(desc),
    'URL:'+short]
    .concat(MI.rr?[MI.rr]:[])
    .concat([
    'BEGIN:VALARM','TRIGGER:PT9H','ACTION:DISPLAY',
    'DESCRIPTION:'+icsEsc('나다움 설계 점검'),'END:VALARM','END:VEVENT','END:VCALENDAR']);
  const ics=lines.map(icsFold).join('\r\n')+'\r\n';
  const b=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='나다움설계_'+MI.fn+'.ics';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(MI.lab+' 일정을 내려받았습니다');
}

/* ───────── 계정 · 동기화 ─────────
   흐름: 이메일 입력 → 매직링크 메일 → 링크를 열면 이 페이지로 돌아와 로그인됨
        → 서버 프로필과 이 기기 프로필을 합쳐 양쪽에 저장
        → 이후 save()가 호출될 때마다 1.5초 뒤 서버에 올린다.
   서버에 올라가는 것은 localStorage의 프로필 JSON 그대로(점수·설계 문장·기록·히스토리).
   문항별 응답은 애초에 프로필에 없으므로 올라가지 않는다. */
let SB=null, AUTH_USER=null, _cloudT=null, _cloudBusy=false, _lastSync='';
const AUTH_DISMISS='nadaum.auth.dismiss';
function authReady(){return !!(AUTH.url&&AUTH.key)}
function authDismissed(){try{return localStorage.getItem(AUTH_DISMISS)==='1'}catch(e){return false}}
function dismissAuth(){try{localStorage.setItem(AUTH_DISMISS,'1')}catch(e){} render();}
function initAuth(){
  if(!authReady())return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  s.onload=function(){
    try{
      SB=window.supabase.createClient(AUTH.url,AUTH.key,{auth:{persistSession:true,detectSessionInUrl:true,flowType:'implicit'}});
      SB.auth.getSession().then(r=>{const u=r&&r.data&&r.data.session?r.data.session.user:null; setUser(u,false)});
      SB.auth.onAuthStateChange((ev,sess)=>{
        const u=sess?sess.user:null;
        if(ev==='SIGNED_IN'&&u&&(!AUTH_USER||AUTH_USER.id!==u.id)) setUser(u,true);
        else if(ev==='SIGNED_OUT') setUser(null,false);
      });
    }catch(e){}
  };
  document.head.appendChild(s);
}
function setUser(u,fresh){
  const was=AUTH_USER; AUTH_USER=u;
  if(u){
    cloudPull().then(remote=>{
      const local=load();
      const merged=mergeProfiles(local,remote)||local||blank();
      try{localStorage.setItem(KEY,JSON.stringify(merged))}catch(e){}
      return cloudPush(merged);
    }).then(()=>{ if(fresh)toast('로그인되었습니다. 기록이 계정에 이어집니다'); render(); })
      .catch(()=>{ render(); });
  }else{ if(was)render(); }
}
let _remindOn=true;
function cloudPull(){
  if(!SB||!AUTH_USER)return Promise.resolve(null);
  return SB.from(AUTH.table).select('data,updated_at,remind_on').eq('user_id',AUTH_USER.id).maybeSingle()
    .then(r=>{ if(r&&r.data){ _lastSync=r.data.updated_at||''; if(typeof r.data.remind_on==='boolean')_remindOn=r.data.remind_on; return r.data.data||null } return null })
    .catch(()=>null);
}
function setRemind(on){
  _remindOn=!!on; if(!SB||!AUTH_USER)return;
  SB.from(AUTH.table).update({remind_on:_remindOn}).eq('user_id',AUTH_USER.id)
    .then(()=>toast(_remindOn?'4주 뒤 메일로 알려 드립니다':'알림 메일을 보내지 않습니다')).catch(()=>{});
}
function cloudPush(p){
  if(!SB||!AUTH_USER)return Promise.resolve();
  p=p||load(); if(!p)return Promise.resolve();
  _cloudBusy=true;
  return SB.from(AUTH.table).upsert({user_id:AUTH_USER.id,report_id:p.id,data:p,updated_at:new Date().toISOString()},{onConflict:'user_id'})
    .then(()=>{_lastSync=new Date().toISOString(); _cloudBusy=false; const el=document.getElementById('syncState'); if(el)el.textContent=syncLabel();})
    .catch(()=>{_cloudBusy=false});
}
function cloudQueue(){
  if(!SB||!AUTH_USER)return;
  clearTimeout(_cloudT); _cloudT=setTimeout(()=>cloudPush(),1500);
}
function syncLabel(){
  if(!_lastSync)return '동기화 대기 중';
  const d=new Date(_lastSync); if(isNaN(d))return '동기화됨';
  return '마지막 동기화 '+(d.getMonth()+1)+'.'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function signIn(inputId){
  const el=document.getElementById(inputId); const email=(el?el.value:'').trim();
  const agree=document.getElementById(inputId+'-agree');

  if(agree&&!agree.checked){toast('개인정보 처리 안내에 동의해 주세요');return}
  if(!SB){toast('잠시 뒤 다시 눌러 주세요');return}
  const btn=document.getElementById(inputId+'-btn'); if(btn){btn.disabled=true;btn.textContent='보내는 중…'}
  SB.auth.signInWithOtp({email:email,options:{emailRedirectTo:BASE+'/report/'}})
    .then(r=>{
      if(r&&r.error){toast('메일을 보내지 못했습니다. 잠시 뒤 다시 시도해 주세요'); if(btn){btn.disabled=false;btn.textContent='로그인 링크 받기'} return}
      const box=document.getElementById(inputId+'-box');
      if(box)box.innerHTML='<div class="acct-sent"><b>'+esc(email)+'</b>로 링크를 보냈습니다.<br>메일의 링크를 열면 이 리포트가 계정에 연결됩니다. 링크는 1시간 동안 유효합니다.</div>';
    });
}
function signOut(){ if(SB)SB.auth.signOut().then(()=>{AUTH_USER=null;_lastSync='';toast('로그아웃했습니다. 이 기기의 기록은 그대로 남습니다');render()}); }

function acctCard(){
  if(!authReady()){
    return '<div class="soon"><b>장기 보관 — 준비 중입니다</b>'
     +'나만의 기록을 오래 보관하고 싶으신 분을 위해, 회원가입(무료)으로 기록을 계속 이어서 보관·관리하는 기능을 준비하고 있습니다. '
     +'지금은 위의 보관 링크가 같은 역할을 합니다.</div>';
  }
  if(AUTH_USER){
    return '<div class="acct on" id="sec-account"><div class="acct-t">계정에 이어지고 있습니다</div>'
     +'<div class="acct-me"><b>'+esc(AUTH_USER.email||'')+'</b><span id="syncState">'+syncLabel()+'</span></div>'
     +'<p class="acct-lead">이 기기에서 남기는 문장과 기록은 자동으로 계정에 저장됩니다. 다른 기기에서 같은 이메일로 로그인하면 이어집니다.</p>'
     +'<label class="acct-agree" style="margin:0 0 12px"><input type="checkbox" id="remindOn" '+(_remindOn?'checked':'')+' onchange="setRemind(this.checked)"><span>4주 뒤 다시 볼 때 메일로 알려 주세요</span></label>'
     +'<div class="btn-row"><button class="btn ghost" onclick="cloudPush().then(()=>toast(\'지금 저장했습니다\'))">지금 저장</button>'
     +'<button class="btn ghost" onclick="signOut()">로그아웃</button></div>'
     +'<div class="acct-foot">계정과 기록을 모두 지우시려면 <a href="mailto:?subject='+encodeURIComponent('나다움 설계 계정 삭제 요청')+'&body='+encodeURIComponent('삭제할 계정 이메일: '+(AUTH_USER.email||''))+'">삭제 요청</a>을 보내 주세요. 확인 후 지웁니다.</div></div>';
  }
  return '<div class="acct" id="sec-account"><div class="acct-t">기록을 오래 갖고 싶다면 — 회원가입(무료)</div>'
   +acctForm('em2','진단과 리포트는 가입 없이 그대로 쓰실 수 있습니다. 가입은 기기를 바꿔도 기록이 이어지고, 변화 기록이 제한 없이 남고, 4주 뒤 메일로 알림을 받고 싶은 분을 위한 것입니다.')
   +'</div>';
}
function nudgeAccount(){
  if(!authReady()||AUTH_USER)return;
  const t=document.getElementById('sec-account');
  if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('sec-flash');setTimeout(()=>t.classList.remove('sec-flash'),1800)}
}

/* ───────── 시작 ───────── */
(function(){
  const merged=mergeFromUrl();
  initAuth();
  render();
  if(merged){
    toast('보관 링크의 결과를 불러왔습니다');
    history.replaceState(null,'',location.pathname);
  }
})();
</script>
